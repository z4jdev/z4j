# z4j-scheduler - plain Kubernetes manifest (no Helm).
#
# A reference deployment with values inlined for clarity. It is not ready to
# apply unchanged: create the referenced Secrets and edit every ``CHANGE ME``
# value first. The Helm chart in ../helm/z4j renders the brain and this
# scheduler together with fail-fast validation that plain YAML cannot
# provide; prefer it. Pair this file with z4j-brain.yaml, whose ConfigMap
# carries the matching gRPC listener block.
#
# Edit the placeholders marked ``# CHANGE ME`` before applying:
#
# 1. The brain endpoints (Service DNS name + ports).
# 2. The TLS Secret reference (must exist in this namespace, with keys
#    tls.crt, tls.key and ca.crt; the chart README section "Scheduler
#    mTLS" covers minting the client certificate and the Secret shape).
# 3. The leader DSN Secret reference. It must contain an asyncpg-compatible
#    ``postgresql://`` or ``postgres://`` URL, not the brain's SQLAlchemy
#    ``postgresql+asyncpg://`` spelling.
# 4. The image tag (the published brain image contains the scheduler;
#    pin its digest if you can).
# 5. To enable /metrics, create the bearer-token Secret, change
#    Z4J_SCHEDULER_METRICS_ENABLED to "true", and uncomment the token
#    env entry together. Metrics ship disabled here so an omitted token
#    does not create a predictable crash loop.
#
# The HA story: per-project Postgres advisory locks make leader
# election stateless, so a standard Deployment with replicas=2 works.
# No StatefulSet needed despite the spec heading naming one.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: z4j-scheduler
  namespace: z4j
  labels:
    app.kubernetes.io/name: z4j-scheduler
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: z4j
# The scheduler does not call the Kubernetes API.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: z4j-scheduler
  namespace: z4j
  labels:
    app.kubernetes.io/name: z4j-scheduler
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: z4j
data:
  # --- brain endpoints (CHANGE ME) ---
  Z4J_SCHEDULER_BRAIN_GRPC_URL: "z4j-brain.z4j.svc.cluster.local:7701"
  Z4J_SCHEDULER_BRAIN_REST_URL: "http://z4j-brain.z4j.svc.cluster.local:7700"
  # --- scope ---
  Z4J_SCHEDULER_PROJECTS: "*"
  # --- HA ---
  # Per-project locks permit distribution but do not balance work; one
  # replica can acquire every project while the other remains standby.
  Z4J_SCHEDULER_LEADER_BACKEND: "postgres_per_project"
  Z4J_SCHEDULER_LEADER_NAMESPACE: "z4j-scheduler-prod"
  # --- defensive periodic full re-sync (15 min) ---
  Z4J_SCHEDULER_RECONCILE_INTERVAL_SECONDS: "900"
  # --- fire dispatch ---
  Z4J_SCHEDULER_FIRE_TIMEOUT_SECONDS: "60"
  Z4J_SCHEDULER_FIRE_RETRY_MAX: "3"
  Z4J_SCHEDULER_FIRE_RETRY_BACKOFF_SECONDS: "1.0"
  # --- observability ---
  Z4J_SCHEDULER_LOG_LEVEL: "INFO"
  Z4J_SCHEDULER_LOG_JSON: "true"
  # Disabled until the token env entry below is enabled too.
  Z4J_SCHEDULER_METRICS_ENABLED: "false"
  Z4J_SCHEDULER_BIND_HOST: "0.0.0.0"
  Z4J_SCHEDULER_BIND_PORT: "7800"
---
apiVersion: v1
kind: Service
metadata:
  name: z4j-scheduler
  namespace: z4j
  labels:
    app.kubernetes.io/name: z4j-scheduler
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: z4j
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 7800
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: z4j-scheduler
    app.kubernetes.io/instance: z4j-scheduler
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: z4j-scheduler
  namespace: z4j
  labels:
    app.kubernetes.io/name: z4j-scheduler
    app.kubernetes.io/instance: z4j-scheduler
    app.kubernetes.io/component: scheduler
    app.kubernetes.io/part-of: z4j
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: z4j-scheduler
      app.kubernetes.io/instance: z4j-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: z4j-scheduler
        app.kubernetes.io/instance: z4j-scheduler
    spec:
      serviceAccountName: z4j-scheduler
      securityContext:
        # The image runs as uid/gid 10001 (user ``z4j``), the same identity
        # the chart and the brain manifest declare.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        # Spread replicas across nodes so a single node failure
        # doesn't take the whole scheduler fleet down.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: z4j-scheduler
                topologyKey: kubernetes.io/hostname
      containers:
        - name: scheduler
          # The brain image includes the z4j-scheduler executable. Pin this
          # release tag to a digest before production rollout if possible.
          image: "z4jdev/z4j:1.12.1"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command: ["z4j-scheduler"]
          args: ["serve"]
          ports:
            - name: http
              containerPort: 7800
              protocol: TCP
          envFrom:
            - configMapRef:
                name: z4j-scheduler
          env:
            - name: Z4J_SCHEDULER_INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: Z4J_SCHEDULER_TLS_CERT
              value: /etc/z4j/tls/tls.crt
            - name: Z4J_SCHEDULER_TLS_KEY
              value: /etc/z4j/tls/tls.key
            - name: Z4J_SCHEDULER_TLS_CA
              value: /etc/z4j/tls/ca.crt
            # CHANGE ME - point at a Secret holding an asyncpg-compatible
            # URL for the same Postgres database the brain uses. Do not reuse
            # a ``postgresql+asyncpg://`` SQLAlchemy URL unchanged.
            # Required when LEADER_BACKEND != "single".
            - name: Z4J_SCHEDULER_LEADER_PG_DSN
              valueFrom:
                secretKeyRef:
                  name: z4j-scheduler-leader-dsn
                  key: leader-pg-dsn
            # CHANGE ME - REQUIRED when Z4J_SCHEDULER_METRICS_ENABLED
            # is changed to "true" (the scheduler refuses to start on a
            # non-loopback bind with metrics enabled and no token). Create
            # the Secret first, e.g.
            #   kubectl -n z4j create secret generic \
            #     z4j-scheduler-metrics-token \
            #     --from-literal=token=$(openssl rand -base64 32)
            # then uncomment:
            # - name: Z4J_SCHEDULER_METRICS_AUTH_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: z4j-scheduler-metrics-token
            #       key: token
          volumeMounts:
            - name: tls
              mountPath: /etc/z4j/tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
      volumes:
        - name: tls
          secret:
            # CHANGE ME - the Secret minted via cert-manager or by
            # the operator (must contain tls.crt, tls.key, ca.crt).
            secretName: z4j-scheduler-tls
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: z4j-scheduler
  namespace: z4j
  labels:
    app.kubernetes.io/name: z4j-scheduler
    app.kubernetes.io/instance: z4j-scheduler
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: z4j-scheduler
      app.kubernetes.io/instance: z4j-scheduler
