{{- if and .Values.brain.enabled (not .Values.brain.secrets.existingSecret) (include "z4j.brain.inlineSecretsAll" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "z4j.fullname" . }}-secrets
  labels:
    {{- include "z4j.brain.labels" . | nindent 4 }}
  annotations:
    # Loud warning so operators browsing ``kubectl get secret -o yaml`` see
    # it before they screenshot anything.
    z4j.com/warning: "inline application secrets - DEV/HOMELAB ONLY. Use brain.secrets.existingSecret in production."
type: Opaque
stringData:
  {{ .Values.brain.secrets.keys.appSecret }}: {{ .Values.brain.secrets.inline.appSecret | quote }}
  {{ .Values.brain.secrets.keys.sessionSecret }}: {{ .Values.brain.secrets.inline.sessionSecret | quote }}
  {{ .Values.brain.secrets.keys.auditChainSecret }}: {{ .Values.brain.secrets.inline.auditChainSecret | quote }}
{{- end }}
