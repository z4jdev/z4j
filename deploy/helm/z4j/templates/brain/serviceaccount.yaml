{{- if and .Values.brain.enabled .Values.brain.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "z4j.brain.serviceAccountName" . }}
  labels:
    {{- include "z4j.brain.labels" . | nindent 4 }}
  {{- with .Values.brain.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The brain does not call the Kubernetes API. The ServiceAccount exists so
# an operator can attach IRSA / Workload Identity / image pull secrets
# without granting unrelated cluster perms.
automountServiceAccountToken: false
{{- end }}
