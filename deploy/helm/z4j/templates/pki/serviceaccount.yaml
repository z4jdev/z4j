{{- if and .Values.brain.enabled .Values.scheduler.enabled .Values.pki.mintJob.enabled -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "z4j.fullname" . }}-pki-mint
  labels:
    {{- include "z4j.pki.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    {{- with .Values.pki.mintJob.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
