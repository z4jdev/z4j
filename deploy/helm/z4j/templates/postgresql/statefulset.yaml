{{- if .Values.postgresql.enabled -}}
{{- include "z4j.validatePostgresql" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "z4j.postgresql.fullname" . }}
  labels:
    {{- include "z4j.postgresql.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "z4j.postgresql.fullname" . }}
  # One instance, no replication: the same shape as the compose stack.
  replicas: 1
  selector:
    matchLabels:
      {{- include "z4j.postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "z4j.postgresql.selectorLabels" . | nindent 8 }}
    spec:
      # The official image's ``postgres`` user is uid/gid 999.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.postgresql.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: postgresql
          image: {{ include "z4j.postgresql.image" . | quote }}
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - postgres
            {{- range $key, $value := .Values.postgresql.config }}
            - -c
            - {{ printf "%s=%s" $key ($value | toString) | quote }}
            {{- end }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "z4j.postgresql.secretName" . }}
                  key: {{ include "z4j.postgresql.passwordKey" . }}
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            # The image stores data under a major-version subdirectory of
            # /var/lib/postgresql, so mount the parent (not the legacy
            # /var/lib/postgresql/data) and future pg_upgrade --link works.
            - name: data
              mountPath: /var/lib/postgresql
            - name: run
              mountPath: /var/run/postgresql
            - name: dshm
              mountPath: /dev/shm
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      volumes:
        - name: run
          emptyDir: {}
        # Parallel query workers share memory through /dev/shm; the
        # container default of 64Mi is too small for shared_buffers.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- toYaml .Values.postgresql.persistence.accessModes | nindent 10 }}
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}
{{- end }}
