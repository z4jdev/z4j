{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "z4j.postgresql.fullname" . }}
  labels:
    {{- include "z4j.postgresql.labels" . | nindent 4 }}
  annotations:
    z4j.com/warning: "inline database password - the bundled PostgreSQL is an evaluation database. Use postgresql.auth.existingSecret or an external PostgreSQL in production."
type: Opaque
stringData:
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
{{- end }}
