{{- if and .Values.scheduler.enabled (not .Values.scheduler.tls.existingSecret) (not .Values.scheduler.tls.certManager.enabled) (not .Values.pki.mintJob.enabled) -}}
{{- if or .Values.scheduler.tls.inline.cert .Values.scheduler.tls.inline.key .Values.scheduler.tls.inline.ca -}}
apiVersion: v1
kind: Secret
metadata:
  # Suffix kept distinct from the cert-manager / mint-job secret name so
  # that an operator switching modes via ``helm upgrade`` does not delete
  # a Secret another tool owns from underneath them.
  name: {{ include "z4j-scheduler.fullname" . }}-tls-inline
  labels:
    {{- include "z4j-scheduler.labels" . | nindent 4 }}
  annotations:
    z4j.com/warning: "inline TLS - DEV/HOMELAB ONLY. Use scheduler.tls.existingSecret, cert-manager or pki.mintJob in production."
type: kubernetes.io/tls
stringData:
  tls.crt: |
{{ .Values.scheduler.tls.inline.cert | indent 4 }}
  tls.key: |
{{ .Values.scheduler.tls.inline.key | indent 4 }}
  ca.crt: |
{{ .Values.scheduler.tls.inline.ca | indent 4 }}
{{- end }}
{{- end }}
