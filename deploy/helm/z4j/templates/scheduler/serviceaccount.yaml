{{- if and .Values.scheduler.enabled .Values.scheduler.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "z4j-scheduler.serviceAccountName" . }}
  labels:
    {{- include "z4j-scheduler.labels" . | nindent 4 }}
  {{- with .Values.scheduler.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The scheduler does not call the Kubernetes API. The ServiceAccount exists
# so an operator can attach IRSA / Workload Identity / image pull secrets
# without granting unrelated cluster perms.
automountServiceAccountToken: false
{{- end }}
