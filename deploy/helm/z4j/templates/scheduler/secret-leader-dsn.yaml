{{- if and .Values.scheduler.enabled (include "z4j-scheduler.leaderDsnFromBundledPostgres" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "z4j-scheduler.leaderDsnSecretName" . }}
  labels:
    {{- include "z4j-scheduler.labels" . | nindent 4 }}
  annotations:
    z4j.com/warning: "composed from the inline postgresql.auth.password; the bundled PostgreSQL is an evaluation database."
type: Opaque
stringData:
  # asyncpg-compatible libpq URL for the same database the brain uses.
  leader-pg-dsn: {{ printf "postgresql://%s:%s@%s:5432/%s" .Values.postgresql.auth.username (urlquery .Values.postgresql.auth.password) (include "z4j.postgresql.host" .) .Values.postgresql.auth.database | quote }}
{{- end }}
