[project]
name = "z4j"
version = "1.11.0"
description = "z4j -- open-source control plane for Python task infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "z4j contributors" }]
keywords = [
    "z4j", "celery", "task", "monitoring", "control-plane",
    "flower", "dashboard", "django", "worker", "queue",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Celery",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]

# z4j 1.4.0 (the consolidation cut): the ``z4j`` distribution now
# ships the brain server (dashboard + REST API + migrations + audit
# log + reconciliation) directly. ``pip install z4j`` is the only
# install path operators need to learn.
#
# Pre-1.4.0, the brain server lived in a separate ``z4j-brain``
# distribution that this umbrella pulled in transitively. That
# split was a packaging accident that leaked into the user mental
# model. 1.4.0 collapses the two distributions into one. The
# ``z4j-brain`` PyPI name continues to exist as a metadata-only
# compatibility shim that depends on ``z4j``, so any operator on
# the ``pip install z4j-brain`` install path keeps working.
#
# The Python import path stays ``import z4j_brain`` (parallels
# ``z4j_core``, ``z4j_celery``, etc. -- the namespace is the
# scope marker for "this is the dashboard/server, not the SDK or
# an adapter"). Adapter packages keep importing from
# ``z4j_brain.*`` unchanged.
#
# Pick adapter engines via extras:
#
#   pip install z4j[celery]           # Celery + beat scheduler
#   pip install z4j[django]           # Django telemetry adapter
#   pip install z4j[django,celery]    # Full Django + Celery stack
#   pip install z4j[postgres]         # Postgres backend
#   pip install z4j[agents]           # Every adapter at once
#   pip install z4j[all]              # All agents + Postgres drivers
#
# Agent-only installs (no AGPL brain in your venv) -- use the
# standalone packages directly, they are all Apache 2.0:
#
#   pip install z4j-core z4j-django   # SDK + Django adapter only
#   pip install z4j-celery            # SDK + Celery adapter only
#
dependencies = [
    "z4j-core>=1.11.0,<2",
    # Server runtime (was in z4j-brain pre-1.4.0).
    "fastapi>=0.136",
    # 1.6.5 (audit R4-M1): explicit Starlette floor for
    # CVE-2026-48710 (BadHost). FastAPI re-exports Starlette and
    # does not yet pin >=1.0.1, so we pin it directly. Drop this
    # line when fastapi raises its own floor past 1.0.1.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.45",
    "pydantic[email]>=2.13.3",
    "pydantic-settings>=2.14.2",
    "sqlalchemy[asyncio]>=2.0.49",
    "alembic>=1.18.4",
    "websockets>=16",
    "httpx>=0.28.1",
    # PEP 440 comparison for the release-aware `z4j upgrade` status command.
    "packaging>=26.2",
    "argon2-cffi>=25.1",
    "structlog>=25.5",
    "prometheus-client>=0.25",
    # 1.6.5 (audit R5-L1): bumped from >=0.0.26 to fix
    # CVE-2026-42561 (Form/File parsing). FastAPI re-exports
    # python-multipart for multipart handling; the brain does
    # not directly parse multipart bodies but the floor closes
    # the CVE in case a future route adds File() inputs.
    "python-multipart>=0.0.31",
    "itsdangerous>=2.2",
    "aiosqlite>=0.22.1",
    # Async SMTP client for email notifications, invitations and password
    # resets. 5.1.2 fixes STARTTLS response injection (CVE-2026-55558);
    # 5.1.3 also rejects address-based ESMTP parameter injection and fixes
    # command/response desynchronization. Keep this service security floor
    # separate from the broad framework ranges in the host adapters.
    "aiosmtplib>=5.1.3",
    # AES-GCM for the v1.6.0 MFA TOTP-secret-at-rest encryption.
    # The brain imports ``z4j_brain.domain.mfa.crypto`` at module
    # load (auth router init), so this is a core dep -- not an
    # optional extra. Promoted out of [scheduler-grpc] in 1.6.0
    # to fix a release-day smoke regression. ``cryptography``
    # ships pre-built wheels for every supported (cp311+) platform.
    "cryptography>=50.0.0",
    # Tasks-page xlsx export. Pure Python, write-only, ~1 MB, no
    # native deps.
    "xlsxwriter>=3.2.9",
    # 1.6.7 (R8 audit + pip-audit M-8/P5 closure): explicit transitive
    # floor pins for two upstream advisories the post-1.6.6 pip-audit
    # surfaced. Both are pure-Python, ~150 KB combined, and become
    # direct dependencies only because operators want a single
    # ``pip install --upgrade z4j`` to lift the floor everywhere these
    # libraries are pulled in transitively (aiohttp via taskiq, pyjwt
    # via redis-py). Drop these lines when the upstream transitive
    # owners raise their own floors past the advisory ceilings.
    # Raised to 3.14.3 for CVE-2026-59881, CVE-2026-69243 (both fixed in
    # 3.14.2) and CVE-2026-69244 (3.14.3). Unlike the two npm advisories that
    # landed the same day, this one is on a SHIPPED runtime path, so the floor
    # is the fix rather than a build-tooling pin.
    "aiohttp>=3.14.3",
    "pyjwt>=2.13.0",
    # Boundary D: the Brain validates every prepared successor using an
    # independent implementation.  These exact pins are the complete
    # cadence-affecting closure and intentionally match z4j-scheduler.
    #
    # tzdata is IANA 2026c. 2026a computes fire times an hour wrong for seven
    # zones with future effect: Africa/Casablanca and Africa/El_Aaiun from
    # 2026-09-20, and America/Edmonton, America/Vancouver, America/Yellowknife,
    # Canada/Mountain and Canada/Pacific from 2026-11-01.
    #
    # A change to this closure changes the cadence runtime fingerprint, and the
    # rollback compatibility carrier must keep computing the same value or the
    # prepare-runtime-rollback ceremony cannot honestly restamp a cursor. The
    # carrier therefore carries this same tzdata, so the sealed rollback target
    # stays byte-equal to this closure. Published 1.8 is untouched: its own
    # bytes are unchanged and it is never asked to agree with this closure
    # except through that ceremony.
    #
    # Both distributions move together or the closure is not exact, and the
    # carrier moves with them or the rollback target is not reachable.
    "croniter==6.2.2",
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
    "astral==3.2",
    "tzdata==2026.3",
]

[project.optional-dependencies]
# ------------------------------------------------------------------
# Engine adapter extras. Each pulls the engine adapter and its
# companion scheduler (if any) in one shot -- the 95% case.
# ------------------------------------------------------------------
celery = ["z4j-celery>=1.11.0,<2", "z4j-celerybeat>=1.11.0,<2"]
django = ["z4j-django>=1.11.0,<2"]
flask = ["z4j-flask>=1.11.0,<2"]
fastapi = ["z4j-fastapi>=1.11.0,<2"]
# Intra-z4j floor policy: extras track the release-wave version so
# a mixed-version install cannot be assembled through the umbrella
# (R9 H-2 precedent: a stale z4j-rq paired with a newer z4j-bare
# dispatcher re-opened the R8 H-1 pickle RCE).
rq = ["z4j-rq>=1.11.0,<2", "z4j-rqscheduler>=1.11.0,<2"]
dramatiq = ["z4j-dramatiq>=1.11.0,<2"]
huey = ["z4j-huey>=1.11.0,<2", "z4j-hueyperiodic>=1.11.0,<2"]
arq = ["z4j-arq>=1.11.0,<2", "z4j-arqcron>=1.11.0,<2"]
taskiq = ["z4j-taskiq>=1.11.0,<2", "z4j-taskiqscheduler>=1.11.0,<2"]
apscheduler = ["z4j-apscheduler>=1.11.0,<2"]
bare = ["z4j-bare>=1.11.0,<2"]

# ------------------------------------------------------------------
# Postgres backend (asyncpg for the application; psycopg/libpq for
# route-pinned restore ceremonies). Was z4j-brain[postgres] pre-1.4.0;
# now lives directly here since z4j IS the brain.
# ------------------------------------------------------------------
postgres = [
    "asyncpg>=0.31",
    # Restore/rollback ceremonies require libpq's separate host + hostaddr
    # inputs so routing stays pinned while verify-full still validates the
    # configured DNS hostname.
    "psycopg[binary]>=3.3.3",
]

# ------------------------------------------------------------------
# Optional error capture via Sentry. Activate with Z4J_SENTRY_DSN
# at runtime. Without this extra the brain runs unchanged and the
# Sentry init helper degrades to a no-op (sentry-sdk ImportError
# is logged at WARNING and discarded).
# ------------------------------------------------------------------
sentry = ["sentry-sdk>=2.8.0,<3"]

# ------------------------------------------------------------------
# Optional OpenTelemetry tracing via OTLP. Activate with
# Z4J_OTEL_EXPORTER_OTLP_ENDPOINT at runtime. Pulls the OTLP HTTP
# exporter + auto-instrumentation for FastAPI / SQLAlchemy / httpx.
# Operators on a gRPC collector additionally install
# `opentelemetry-exporter-otlp-proto-grpc` and set
# Z4J_OTEL_PROTOCOL=grpc.
# ------------------------------------------------------------------
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

# ------------------------------------------------------------------
# z4j-scheduler companion process. The scheduler submits prepared fires to
# the brain over gRPC, and the brain routes them to connected engine agents.
# ------------------------------------------------------------------
scheduler-grpc = [
    # Floors must not drop below the committed gRPC/protobuf gencode:
    # scheduler_pb2_grpc.py hard-requires grpcio>=1.80.0 and scheduler_pb2.py
    # rejects a protobuf runtime older than its 6.31.1 gencode. The published
    # protobuf floor is higher because 6.33.5 is the first advisory-fixed
    # runtime; either lower bound would otherwise permit an unsafe install.
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "protobuf>=6.33.5",
    "cryptography>=50.0.0",
]

# ------------------------------------------------------------------
# Test extras (was z4j-brain[test] / [test-integration]).
# ------------------------------------------------------------------
test = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
    "freezegun>=1.5.5",
    "hypothesis>=6.152.1",
    # The scheduler-client tests ``import grpc`` at module scope. grpcio is
    # optional for running the brain ([scheduler-grpc]) but mandatory for
    # testing it, and an install that lacks it loses those modules at
    # collection instead of failing them. Same floor as [scheduler-grpc]:
    # the committed gencode rejects an older runtime at import time.
    "grpcio>=1.80.0",
]
test-integration = [
    "testcontainers[postgres]>=4.14.2",
    "psycopg[binary]>=3.3.3",
]

# ------------------------------------------------------------------
# Convenience bundles.
#   [agents] = every adapter engine, useful for CI / dev rigs that
#              test against all engines at once.
#   [all]    = agents + postgres. Observability and the separate dynamic
#              scheduler remain explicit choices.
# ------------------------------------------------------------------
agents = ["z4j[celery,django,flask,fastapi,rq,dramatiq,huey,arq,taskiq,apscheduler,bare]"]
all = ["z4j[agents,postgres]"]

[project.scripts]
# The retired ``z4j-brain`` console alias is not shipped. Callers
# must invoke ``z4j``; after that command-name migration the entry
# point behavior is the same.
z4j = "z4j_brain.cli:main"

[project.urls]
Homepage = "https://z4j.com"
Source = "https://github.com/z4jdev/z4j"
Documentation = "https://z4j.dev"
Issues = "https://github.com/z4jdev/z4j/issues"
Changelog = "https://github.com/z4jdev/z4j/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

# Bundle the built dashboard SPA, docs, and data files into BOTH
# the sdist and the wheel. Lifted from packages/z4j-brain/pyproject
# pre-1.4.0; same build-time recipe, just lives here now.
[tool.hatch.build]
artifacts = [
  "backend/src/z4j_brain/dashboard/**",
  "backend/src/z4j_brain/docs/**",
  "backend/src/z4j_brain/data/**",
]

[tool.hatch.build.targets.wheel]
# Ship two top-level packages: the brain server (the code that does
# the work) and the umbrella marker (so ``import z4j`` is a no-op
# but resolves cleanly for any caller that probes for it).
packages = ["src/z4j", "backend/src/z4j_brain"]

[tool.hatch.build.targets.wheel.sources]
# Strip the layout prefixes so the wheel content is flat:
#   src/z4j/...                  -> z4j/...
#   backend/src/z4j_brain/...    -> z4j_brain/...
"src" = ""
"backend/src" = ""

[tool.hatch.build.targets.wheel.force-include]
"docker/rollback-1.8.2-py3147/manifest.json" = "z4j_brain/data/rollback-1.8.2-py3147-manifest.json"
"docker/rollback-1.8.2-py3147/durable_evidence.py" = "z4j_brain/rollback_compat_durable_evidence.py"

# Include Docker Compose recipes + ``.env.example`` in the sdist so
# ``pip install z4j`` + ``pip download --no-deps z4j`` + unpacking
# the sdist gives operators a full docker-compose kit. The dashboard source
# inputs are retained so the production-image verifier can recompute its exact
# projection in a standalone release checkout. Except for the exact rollback
# manifest and offline durable verifier above, these files are NOT in the wheel.
[tool.hatch.build.targets.sdist]
include = [
  "src/z4j",
  "backend",
  "dashboard/.npmrc",
  "dashboard/components.json",
  "dashboard/index.html",
  "dashboard/package.json",
  "dashboard/pnpm-lock.yaml",
  "dashboard/pnpm-workspace.yaml",
  "dashboard/public/**",
  "dashboard/scripts/**",
  "dashboard/src/**",
  "dashboard/tsconfig.json",
  "dashboard/vite.config.ts",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/SECURITY.md",
  "/pyproject.toml",
  "/Dockerfile",
  "docker/production/**",
  "/.dockerignore",
  "/docker-compose.yml",
  "/docker-compose.postgres.yml",
  "/docker-compose.caddy.yml",
  "deploy",
  "docker/rollback-1.8.2-py3147/Dockerfile",
  "docker/rollback-1.8.2-py3147/README.md",
  "docker/rollback-1.8.2-py3147/manifest.json",
  "docker/rollback-1.8.2-py3147/verify.py",
  "docker/rollback-1.8.2-py3147/durable_evidence.py",
  "docker/rollback-1.8.2-py3147/recovery_evidence.py",
  "/.env.example",
]
exclude = [
  "dashboard/**/node_modules/**",
  "dashboard/**/dist/**",
  "dashboard/**/.pnpm-store/**",
  "dashboard/**/.cache/**",
  "dashboard/**/coverage/**",
  "dashboard/**/.vite/**",
  "dashboard/**/.turbo/**",
  "dashboard/**/.DS_Store",
  "dashboard/**/__pycache__/**",
  "dashboard/**/*.map",
  "dashboard/**/*.pyc",
  "dashboard/**/*.pyo",
]

# The compose kit must build before the coordinated package wave exists on
# PyPI. Bundle the matching Apache-2.0 z4j-core and z4j-scheduler sources in
# the sdist's Docker deployment payload only; the z4j wheel remains unchanged.
[tool.hatch.build.targets.sdist.force-include]
"../z4j-core/pyproject.toml" = "docker/vendor/z4j-core/pyproject.toml"
"../z4j-core/README.md" = "docker/vendor/z4j-core/README.md"
"../z4j-core/LICENSE" = "docker/vendor/z4j-core/LICENSE"
"../z4j-core/src/z4j_core" = "docker/vendor/z4j-core/src/z4j_core"
"../z4j-scheduler/pyproject.toml" = "docker/vendor/z4j-scheduler/pyproject.toml"
"../z4j-scheduler/README.md" = "docker/vendor/z4j-scheduler/README.md"
"../z4j-scheduler/CHANGELOG.md" = "docker/vendor/z4j-scheduler/CHANGELOG.md"
"../z4j-scheduler/LICENSE" = "docker/vendor/z4j-scheduler/LICENSE"
"../z4j-scheduler/proto" = "docker/vendor/z4j-scheduler/proto"
"../z4j-scheduler/src/z4j_scheduler" = "docker/vendor/z4j-scheduler/src/z4j_scheduler"
