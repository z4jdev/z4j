name: Security

# Security gates for the generated standalone z4j repository. The dependency
# job resolves every published optional extra. The container job builds this
# commit and scans that candidate; scanning Docker Hub ``latest`` would only
# re-check a previously released image and could not gate a Dockerfile change.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  pip-audit:
    name: Dependency CVE scan (all published extras)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # immutable ref; audited 2026-08-20

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # immutable ref; audited 2026-08-20
        with:
          python-version: "3.14.7"

      - name: Install pip-audit
        run: pip install --quiet "pip-audit==2.10.1"

      - name: Export every declared dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))[
              "project"
          ]
          requirements = list(project.get("dependencies", ()))
          for group in project.get("optional-dependencies", {}).values():
              requirements.extend(group)
          Path("requirements-audit.txt").write_text(
              "\n".join(sorted(set(requirements))) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Audit the complete declared graph
        run: |
          pip-audit -r requirements-audit.txt \
            --strict \
            --progress-spinner off

  trivy:
    name: Trivy candidate filesystem + image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # immutable ref; audited 2026-08-20

      - name: Scan candidate filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # immutable ref; audited 2026-08-20
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: "."
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload filesystem SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # immutable ref; audited 2026-08-20
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Build candidate image from this commit
        run: |
          # The image needs to know its own version so it can resolve the
          # companion scheduler from the matching minor line. The release
          # workflow takes that from the git tag, but this job runs on a
          # branch, where there is no tag to read. Take it from the package
          # metadata instead, which is the same value the tag would carry.
          VERSION="$(
            grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2
          )"
          if [ -z "${VERSION}" ]; then
            echo "::error::could not read version from pyproject.toml"
            exit 1
          fi
          docker build \
            --build-arg "Z4J_VERSION=${VERSION}" \
            --tag "z4j-security-candidate:${GITHUB_SHA}" .

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # immutable ref; audited 2026-08-20
        with:
          version: v0.74.0
          image-ref: z4j-security-candidate:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # immutable ref; audited 2026-08-20
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
