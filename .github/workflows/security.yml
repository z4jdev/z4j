name: Security

# Security gates for the generated standalone z4j repository. The dependency
# job resolves every published optional extra. The container job builds this
# commit and scans that candidate; scanning Docker Hub ``latest`` would only
# re-check a previously released image and could not gate a Dockerfile change.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  pip-audit:
    name: Dependency CVE scan (all published extras)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"

      - name: Install pip-audit
        run: pip install --quiet "pip-audit==2.10.1"

      - name: Export every declared dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))[
              "project"
          ]
          requirements = list(project.get("dependencies", ()))
          for group in project.get("optional-dependencies", {}).values():
              requirements.extend(group)
          Path("requirements-audit.txt").write_text(
              "\n".join(sorted(set(requirements))) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Audit the complete declared graph
        run: |
          pip-audit -r requirements-audit.txt \
            --strict \
            --progress-spinner off

  trivy:
    name: Trivy candidate filesystem + image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Scan candidate filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload filesystem SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b6a472f63d85b9c78a3ac5e89422239fc15e9b3c # v3.28.1
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Build candidate image from this commit
        run: docker build --tag "z4j-security-candidate:${GITHUB_SHA}" .

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: z4j-security-candidate:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload image SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@b6a472f63d85b9c78a3ac5e89422239fc15e9b3c # v3.28.1
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
