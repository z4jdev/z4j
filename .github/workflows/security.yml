name: Security

# Security gates for the generated standalone z4j repository. The dependency
# job resolves every published optional extra. The container job builds this
# commit and scans that candidate; scanning Docker Hub ``latest`` would only
# re-check a previously released image and could not gate a Dockerfile change.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  pip-audit:
    name: Dependency CVE scan (all published extras)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # immutable ref; audited 2026-08-20

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # immutable ref; audited 2026-08-20
        with:
          python-version: "3.14.7"

      - name: Install pip-audit
        run: pip install --quiet "pip-audit==2.10.1"

      - name: Export every declared dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))[
              "project"
          ]
          requirements = list(project.get("dependencies", ()))
          for group in project.get("optional-dependencies", {}).values():
              requirements.extend(group)
          Path("requirements-audit.txt").write_text(
              "\n".join(sorted(set(requirements))) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Audit the complete declared graph
        run: |
          pip-audit -r requirements-audit.txt \
            --strict \
            --progress-spinner off

  trivy:
    name: Trivy candidate filesystem + image
    runs-on: ubuntu-24.04
    steps:
      # The image is built from an sdist, as every published image is: the
      # Dockerfile refuses any other context. The z4j sdist bundles z4j-core
      # and z4j-scheduler from sibling checkouts (pyproject force-includes
      # ../z4j-core and ../z4j-scheduler), so they are checked out beside
      # this repository exactly as the release staging lays them out.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # immutable ref; audited 2026-08-20
        with:
          path: z4j

      - name: Checkout bundled z4j-core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # immutable ref; audited 2026-08-20
        with:
          repository: z4jdev/z4j-core
          path: z4j-core

      - name: Checkout bundled z4j-scheduler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # immutable ref; audited 2026-08-20
        with:
          repository: z4jdev/z4j-scheduler
          path: z4j-scheduler

      - name: Scan candidate filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # immutable ref; audited 2026-08-20
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: z4j
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          # Without this the action drops the severity filter whenever the
          # format is SARIF, and exit-code then fails on a finding of any
          # severity. The gate is CRITICAL,HIGH, the same as the local lane.
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload filesystem SARIF
        # Upload only a report the scan actually wrote. A finding fails the
        # scan step with the SARIF in place, and that failure is the job's
        # verdict; a scan that never ran leaves no file, and uploading a
        # missing path would stack a second, misleading failure on top.
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # immutable ref; audited 2026-08-20
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # immutable ref; audited 2026-08-20
        with:
          python-version: "3.14.7"

      - name: Build candidate image from this commit
        run: |
          # The image needs to know its own version so it can resolve the
          # companion scheduler from the matching minor line. The release
          # workflow takes that from the git tag, but this job runs on a
          # branch, where there is no tag to read. Take it from the package
          # metadata instead, which is the same value the tag would carry.
          VERSION="$(
            grep -m1 '^version = ' z4j/pyproject.toml | cut -d'"' -f2
          )"
          if [ -z "${VERSION}" ]; then
            echo "::error::could not read version from pyproject.toml"
            exit 1
          fi
          # Build the sdist the release would publish, with the uv the
          # Dockerfile pins, and build the image from its extracted context.
          pip install --quiet "uv==0.12.5"
          uv build --sdist --out-dir "${RUNNER_TEMP}/sdist" z4j
          SDIST="${RUNNER_TEMP}/sdist/z4j-${VERSION}.tar.gz"
          test -f "${SDIST}" || { echo "::error::uv build wrote no ${SDIST}"; exit 1; }
          CONTEXT="${RUNNER_TEMP}/context"
          mkdir -p "${CONTEXT}"
          tar -xzf "${SDIST}" -C "${CONTEXT}" --strip-components=1
          docker build \
            --build-arg "Z4J_VERSION=${VERSION}" \
            --tag "z4j-security-candidate:${GITHUB_SHA}" \
            --file "${CONTEXT}/Dockerfile" "${CONTEXT}"

      - name: Scan candidate image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # immutable ref; audited 2026-08-20
        with:
          version: v0.74.0
          image-ref: z4j-security-candidate:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload image SARIF
        # Same guard as the filesystem upload. When the filesystem scan
        # fails, the build and image scan above are skipped and this file
        # never exists; the job must fail for the finding alone.
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # immutable ref; audited 2026-08-20
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
