      - name: Require truthful create or recovery mode
        if: ${{ !inputs.dry_run }}
        env:
          STATE: ${{ steps.classify.outputs.state }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          set -euo pipefail
          case "${STATE}" in
            absent)
              test "${CONFIRMATION}" = "CREATE IMMUTABLE v1.9.0"
              test -z "${RECOVERY_RUN_ID}"
              ;;
            recovery-required-exact)
              test "${CONFIRMATION}" = "RECOVER EXACT IMMUTABLE v1.9.0 EVIDENCE"
              printf '%s' "${RECOVERY_RUN_ID}" | grep -Eq '^[1-9][0-9]*$'
              ;;
            *)
              echo "::error::unexpected source-tag classification"
              exit 1
              ;;
          esac

      - name: Authenticate prior failed protected run for recovery
        if: ${{ !inputs.dry_run && steps.classify.outputs.state == 'recovery-required-exact' }}
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          github_get_canonical() {
            output="$1"
            url="$2"
            status=$("${CURL}" --config - --fail-with-body --silent --show-error \
              --output "${output}.raw" --write-out '%{http_code}' "${url}" <<EOF
          header = "Authorization: Bearer ${GITHUB_TOKEN}"
          header = "Accept: application/vnd.github+json"
          header = "X-GitHub-Api-Version: 2026-03-10"
          EOF
            )
            test "${status}" = 200
            python -B - "${output}.raw" "${output}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_bytes())
          raw = (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          descriptor = os.open(sys.argv[2], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          try:
              os.write(descriptor, raw)
          finally:
              os.close(descriptor)
          PY
            rm -f "${output}.raw"
          }
          github_get_canonical "${EVIDENCE}/prior-run.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}"
          github_get_canonical "${EVIDENCE}/prior-jobs.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}/jobs?filter=latest&per_page=100"
          github_get_canonical "${EVIDENCE}/prior-approvals.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RECOVERY_RUN_ID}/approvals"
          python -I -B "${HELPER}" recovery-authority \
            --run-response "${EVIDENCE}/prior-run.json" \
            --jobs-response "${EVIDENCE}/prior-jobs.json" \
            --approvals-response "${EVIDENCE}/prior-approvals.json" \
            --prior-run-id "${RECOVERY_RUN_ID}" \
            --approved-commit "${APPROVED_COMMIT}" \
            --source-workflow-id \
              "$(python -I -B -c 'import json;print(json.load(open("'"'${EVIDENCE}/source-workflow.json'"'"))["id"])')" \
            --source-workflow-node-id \
              "$(python -I -B -c 'import json;print(json.load(open("'"'${EVIDENCE}/source-workflow.json'"'"))["node_id"])')" \
            --output "${EVIDENCE}/recovery-authority.json"

      - name: Dry-run stops before the sole mutation
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-tag-only-dry-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source-tag-evidence/source-tag-plan.json
            ${{ runner.temp }}/source-tag-evidence/registry-capability.json
          if-no-files-found: error
          retention-days: 7

      - name: Create the absent immutable tag only
        if: ${{ !inputs.dry_run && steps.classify.outputs.state == 'absent' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTHORIZATION=$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)
          export GIT_CONFIG_COUNT=3
          export GIT_CONFIG_KEY_0=core.hooksPath
          export GIT_CONFIG_VALUE_0=/dev/null
          export GIT_CONFIG_KEY_1=push.followTags
          export GIT_CONFIG_VALUE_1=false
          export GIT_CONFIG_KEY_2=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_2="AUTHORIZATION: basic ${AUTHORIZATION}"
          git push --porcelain --no-follow-tags origin "${tag_object}:${TAG_REF}" \
            > "${EVIDENCE}/tag-push.txt" 2>&1
          unset AUTHORIZATION GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0 \
            GIT_CONFIG_KEY_1 GIT_CONFIG_VALUE_1 GIT_CONFIG_KEY_2 GIT_CONFIG_VALUE_2
          printf 'transition=created-under-signed-immutable-authority\n' >> "${GITHUB_ENV}"

      - name: Recover evidence for exact existing immutable tag without mutation
        if: ${{ !inputs.dry_run && steps.classify.outputs.state == 'recovery-required-exact' }}
