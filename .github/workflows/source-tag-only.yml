          printf '%s\n' 'transition=recovered-existing-exact-under-signed-immutable-authority' \
            >> "${GITHUB_ENV}"

      - name: Re-read exact tag after the ceremony
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f "${EVIDENCE}/tag-ref.raw" "${EVIDENCE}/tag-ref.json" \
            "${EVIDENCE}/tag-object.raw" "${EVIDENCE}/tag-object.json"
          status=$("${CURL}" --config - --fail-with-body --silent --show-error \
            --output "${EVIDENCE}/tag-ref.raw" --write-out '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/v1.9.0" <<EOF
          header = "Authorization: Bearer ${GITHUB_TOKEN}"
          header = "Accept: application/vnd.github+json"
          header = "X-GitHub-Api-Version: 2026-03-10"
          EOF
          )
          test "${status}" = "200"
          python -B - "${EVIDENCE}/tag-ref.raw" "${EVIDENCE}/tag-ref.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          raw = json.dumps(json.loads(Path(sys.argv[1]).read_bytes()), sort_keys=True, separators=(",", ":")).encode("ascii") + b"\n"
          fd = os.open(sys.argv[2], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          try: os.write(fd, raw)
          finally: os.close(fd)
          PY
          object_sha=$(python -I -B - "${EVIDENCE}/tag-ref.json" <<'PY'
          import json, sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_bytes())["object"]["sha"])
          PY
          )
          status=$("${CURL}" --config - --fail-with-body --silent --show-error \
            --output "${EVIDENCE}/tag-object.raw" --write-out '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" <<EOF
          header = "Authorization: Bearer ${GITHUB_TOKEN}"
          header = "Accept: application/vnd.github+json"
          header = "X-GitHub-Api-Version: 2022-11-28"
          EOF
          )
          test "${status}" = "200"
          python -B - "${EVIDENCE}/tag-object.raw" "${EVIDENCE}/tag-object.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          raw = json.dumps(json.loads(Path(sys.argv[1]).read_bytes()), sort_keys=True, separators=(",", ":")).encode("ascii") + b"\n"
          fd = os.open(sys.argv[2], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          try: os.write(fd, raw)
          finally: os.close(fd)
          PY
          python -I -B "${HELPER}" verify-remote \
            --plan "${EVIDENCE}/source-tag-plan.json" \
            --ref-response "${EVIDENCE}/tag-ref.json" \
            --tag-response "${EVIDENCE}/tag-object.json"
          git -c core.hooksPath=/dev/null update-ref "${TAG_REF}" "${tag_object}"
          test "$(git rev-parse "${TAG_REF}^{commit}")" = "${GITHUB_SHA}"

      - name: Reauthenticate immutable wheelhouse retention before evidence publication
        if: ${{ !inputs.dry_run }}
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          APPROVED_TREE: ${{ inputs.approved_tree }}
          RULESET_ID: ${{ inputs.immutable_tag_ruleset_id }}
          Z4J_DOCKERHUB_PUBLISHER_PAT: ${{ secrets.Z4J_DOCKERHUB_PUBLISHER_PAT }}
          Z4J_DOCKERHUB_PUBLISHER_PAT_HMAC_KEY_B64: ${{ secrets.Z4J_DOCKERHUB_PUBLISHER_PAT_HMAC_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          auth_request="${EVIDENCE}/hub-prepublish-auth.json"
          token_response="${EVIDENCE}/hub-prepublish-token.json"
          token_config="${EVIDENCE}/hub-prepublish.curl"
          repository_raw="${EVIDENCE}/wheelhouse-repository-prepublish.raw"
          trap 'rm -f "${auth_request}" "${token_response}" "${token_config}" "${repository_raw}"' EXIT
          python -B - "${auth_request}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          value = {
              "identifier": os.environ["GITHUB_REPOSITORY_OWNER"],
              "secret": os.environ["Z4J_DOCKERHUB_PUBLISHER_PAT"],
          }
          Path(sys.argv[1]).write_bytes(
              (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          )
          PY
          status=$("${CURL}" --silent --show-error --fail-with-body --request POST \
            --header 'Content-Type: application/json' --data-binary "@${auth_request}" \
            --output "${token_response}" --write-out '%{http_code}' \
            'https://hub.docker.com/v2/auth/token')
          test "${status}" = 200
          python -B - "${token_response}" "${token_config}" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_bytes())
          token = value.get("access_token") if isinstance(value, dict) else None
          if not isinstance(token, str) or re.fullmatch(r"[A-Za-z0-9._~-]+", token) is None:
              raise SystemExit("Docker Hub access token response differs")
          Path(sys.argv[2]).write_text(f'header = "Authorization: Bearer {token}"\n', encoding="ascii")
          PY
          status=$("${CURL}" --config "${token_config}" --silent --show-error \
            --fail-with-body --request GET --output "${repository_raw}" \
            --write-out '%{http_code}' "${HUB_API_REPOSITORY}")
          test "${status}" = 200
          python -B - "${repository_raw}" "${EVIDENCE}/wheelhouse-repository-prepublish.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          raw = (
              json.dumps(json.loads(Path(sys.argv[1]).read_bytes()), sort_keys=True, separators=(",", ":"))
              + "\n"
          ).encode("ascii")
          descriptor = os.open(sys.argv[2], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          try:
              os.write(descriptor, raw)
          finally:
              os.close(descriptor)
          PY
          rm -f "${auth_request}" "${token_response}" "${token_config}" "${repository_raw}"
          trap - EXIT
          python -I -B "${HELPER}" plan \
            --repo . --manifest "${MANIFEST}" \
            --repository-response "${EVIDENCE}/repository.json" \
            --main-ref-response "${EVIDENCE}/main-ref.json" \
            --ruleset-response "${EVIDENCE}/ruleset.json" \
            --environment-response "${EVIDENCE}/environment.json" \
            --wheelhouse-repository-response "${EVIDENCE}/wheelhouse-repository-prepublish.json" \
            --main-ruleset-response "${EVIDENCE}/main-ruleset.json" \
            --main-branch-protection-response \
              "${EVIDENCE}/main-branch-protection.json" \
            --source-workflow-response "${EVIDENCE}/source-workflow.json" \
            --release-workflow-response "${EVIDENCE}/release-workflow.json" \
            --source-main-plan "${EVIDENCE}/source-main/source-main-transition-plan.json" \
            --source-main-readback "${EVIDENCE}/source-main/source-main-transition-readback.json" \
            --release-settings-authority "${EVIDENCE}/source-main/release-settings-authority.json" \
            --source-main-runs-response "${EVIDENCE}/source-main-runs-recheck.json" \
            --workflow-inventory-response "${EVIDENCE}/workflow-inventory-recheck.json" \
            --approved-commit "${APPROVED_COMMIT}" --approved-tree "${APPROVED_TREE}" \
            --ruleset-id "${RULESET_ID}" --actor "${GITHUB_ACTOR}" \
            --output "${EVIDENCE}/source-tag-final-plan.json" \
            --tag-object-output "${EVIDENCE}/source-tag-final-object.txt"
          cmp "${EVIDENCE}/source-tag-object.txt" "${EVIDENCE}/source-tag-final-object.txt"

      - name: Emit exact three-file portable source-tag authority
        if: ${{ !inputs.dry_run }}
        env:
          APPROVED_COMMIT: ${{ inputs.approved_commit }}
          APPROVED_TREE: ${{ inputs.approved_tree }}
          RECOVERY_ARTIFACT_DIGEST: ${{ inputs.recovery_artifact_digest }}
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: |
          set -euo pipefail
          helper_oid=$(git -c core.hooksPath=/dev/null rev-parse \
            "${GITHUB_SHA}:.github/source_tag_authority.py")
          test ! -L "${HELPER}"
          test "$(git -c core.hooksPath=/dev/null hash-object "${HELPER}")" = "${helper_oid}"
          if [ -n "${RECOVERY_ARTIFACT_DIGEST}" ]; then
            prior_attempt=$(python -I -B -c \
              'import json;print(json.load(open("'"'${EVIDENCE}/recovery-authority.json'"'"))["prior_run"]["run_attempt"])')
            python -I -B "${HELPER}" materialize-durable \
              --manifest "${MANIFEST}" \
              --approved-commit "${APPROVED_COMMIT}" \
              --approved-tree "${APPROVED_TREE}" \
              --artifact-digest "${RECOVERY_ARTIFACT_DIGEST}" \
              --authority-run-id "${RECOVERY_RUN_ID}" \
              --authority-run-attempt "${prior_attempt}" \
              --output-root "${PORTABLE}" \
              > "${EVIDENCE}/materialization.json"
          else
            mkdir -m 0700 "${PORTABLE}"
          recovery_args=()
          if [ "${transition}" = \
            "recovered-existing-exact-under-signed-immutable-authority" ]; then
            recovery_args=(--recovery-authority "${EVIDENCE}/recovery-authority.json")
          fi
          push_args=()
          if [ "${transition}" = "created-under-signed-immutable-authority" ]; then
            push_args=(--push-response "${EVIDENCE}/tag-push.txt")
          fi
          python -I -B "${HELPER}" receipt \
            --plan "${EVIDENCE}/source-tag-final-plan.json" \
            --transition "${transition}" \
            --run-id "${GITHUB_RUN_ID}" \
            --run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --actor "${GITHUB_ACTOR}" \
            --workflow-sha "${GITHUB_SHA}" \
            --ref-response "${EVIDENCE}/tag-ref.json" \
            --tag-response "${EVIDENCE}/tag-object.json" \
            "${recovery_args[@]}" \
            "${push_args[@]}" \
            --output "${PORTABLE}/source-tag-creation-receipt.json"
          emitted_bundle="${EVIDENCE}/source-tag-creation-receipt.sigstore.emitted.json"
          "${EVIDENCE}/cosign" sign-blob --yes --new-bundle-format=true \
            --use-signing-config=true \
            --bundle "${emitted_bundle}" \
            "${PORTABLE}/source-tag-creation-receipt.json"
          python -I -B "${HELPER}" canonicalize-bundle \
            --input "${emitted_bundle}" \
            --receipt "${PORTABLE}/source-tag-creation-receipt.json" \
            --output "${PORTABLE}/source-tag-creation-receipt.sigstore.json" \
            > "${EVIDENCE}/source-tag-bundle-canonicalization.json"
          rm -f "${emitted_bundle}"
          "${EVIDENCE}/cosign" verify-blob \
            --bundle "${PORTABLE}/source-tag-creation-receipt.sigstore.json" \
            --certificate-identity \
              "https://github.com/z4jdev/z4j/.github/workflows/source-tag-only.yml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-github-workflow-name source-tag-only \
            --certificate-github-workflow-repository z4jdev/z4j \
            --certificate-github-workflow-ref refs/heads/main \
            --certificate-github-workflow-sha "${GITHUB_SHA}" \
            --certificate-github-workflow-trigger workflow_dispatch \
            "${PORTABLE}/source-tag-creation-receipt.json" > /dev/null
          python -I -B "${HELPER}" build-index \
            --receipt "${PORTABLE}/source-tag-creation-receipt.json" \
            --bundle "${PORTABLE}/source-tag-creation-receipt.sigstore.json" \
            --manifest "${MANIFEST}" \
            --output "${PORTABLE}/source-tag-evidence-index.json"
          fi
          test "$(find "${PORTABLE}" -maxdepth 1 -type f | wc -l)" -eq 3
          test "$(find "${PORTABLE}" -mindepth 1 -maxdepth 1 | wc -l)" -eq 3

      - name: Configure private registry credentials without argv exposure
        if: ${{ !inputs.dry_run }}
        env:
          Z4J_DOCKERHUB_PUBLISHER_PAT: ${{ secrets.Z4J_DOCKERHUB_PUBLISHER_PAT }}
          Z4J_DOCKERHUB_PUBLISHER_PAT_HMAC_KEY_B64: ${{ secrets.Z4J_DOCKERHUB_PUBLISHER_PAT_HMAC_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 0700 "${EVIDENCE}/docker-config"
          python -B - "${EVIDENCE}/docker-config/config.json" <<'PY'
          import base64
          import json
          import os
          import sys
          from pathlib import Path

          credential = base64.b64encode(
              f"{os.environ['GITHUB_REPOSITORY_OWNER']}:"
              f"{os.environ['Z4J_DOCKERHUB_PUBLISHER_PAT']}".encode()
          ).decode("ascii")
          value = {"auths": {"https://index.docker.io/v1/": {"auth": credential}}}
          Path(sys.argv[1]).write_bytes(
              (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          )
          PY
          printf 'DOCKER_CONFIG=%s\n' "${EVIDENCE}/docker-config" >> "${GITHUB_ENV}"

      - name: Publish or reuse and raw-refetch durable OCI source authority
        if: ${{ !inputs.dry_run }}
        env:
          Z4J_DOCKERHUB_PUBLISHER_PAT: ${{ secrets.Z4J_DOCKERHUB_PUBLISHER_PAT }}
          Z4J_DOCKERHUB_PUBLISHER_PAT_HMAC_KEY_B64: ${{ secrets.Z4J_DOCKERHUB_PUBLISHER_PAT_HMAC_KEY_B64 }}
        run: |
          set -euo pipefail
          python -I -B "${HELPER}" publish-durable \
            --root "${PORTABLE}" \
            --repo . \
            --manifest "${MANIFEST}" \
            --cosign "${EVIDENCE}/cosign" \
            --version-output "${EVIDENCE}/cosign-version.json" \
            --output-dir "${EVIDENCE}/durable-readback" \
            > "${EVIDENCE}/durable-verification.json"

      - name: Dispatch authenticated release-docker after durable authority readback
        if: ${{ !inputs.dry_run }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -I -B "${HELPER}" dispatch-request \
            --durable-verification "${EVIDENCE}/durable-verification.json" \
            --receipt "${PORTABLE}/source-tag-creation-receipt.json" \
            --initiating-run-id "${GITHUB_RUN_ID}" \
            --initiating-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --actor "${GITHUB_ACTOR}" \
            --output "${EVIDENCE}/release-dispatch-request.json"
          status=$("${CURL}" --config - --fail-with-body --silent --show-error \
            --request GET --output "${EVIDENCE}/release-workflow-pre-dispatch.raw" \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/270520651" <<EOF
          header = "Authorization: Bearer ${GITHUB_TOKEN}"
          header = "Accept: application/vnd.github+json"
          header = "X-GitHub-Api-Version: 2026-03-10"
          EOF
          )
          test "${status}" = "200"
          python -B - "${EVIDENCE}/release-workflow-pre-dispatch.raw" \
            "${EVIDENCE}/release-workflow-pre-dispatch.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          raw = json.dumps(json.loads(Path(sys.argv[1]).read_bytes()), sort_keys=True, separators=(",", ":")).encode("ascii") + b"\n"
          fd = os.open(sys.argv[2], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          try: os.write(fd, raw)
          finally: os.close(fd)
          PY
          python -I -B "${HELPER}" verify-release-workflow \
            --response "${EVIDENCE}/release-workflow-pre-dispatch.json" > /dev/null
          status=$("${CURL}" --config - --fail-with-body --silent --show-error \
            --request POST --header 'Content-Type: application/json' \
            --data-binary "@${EVIDENCE}/release-dispatch-request.json" \
            --output "${EVIDENCE}/release-dispatch-response.json" \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/270520651/dispatches" <<EOF
          header = "Authorization: Bearer ${GITHUB_TOKEN}"
          header = "Accept: application/vnd.github+json"
          header = "X-GitHub-Api-Version: 2026-03-10"
          EOF
          )
          if [ "${status}" != "200" ]; then
            echo "::error::release-docker dispatch must return HTTP 200 details, got ${status}"
            exit 1
          fi
          run_url=$(python -I -B - "${EVIDENCE}/release-dispatch-response.json" <<'PY'
          import json, re, sys
          from pathlib import Path
          value = json.loads(Path(sys.argv[1]).read_bytes())
          if set(value) != {"workflow_run_id", "run_url", "html_url"}:
              raise SystemExit("release dispatch response keys differ")
          url = value["run_url"]
          if not isinstance(url, str) or re.fullmatch(
              r"https://api\.github\.com/repos/z4jdev/z4j/actions/runs/[1-9][0-9]*", url
          ) is None:
              raise SystemExit("release dispatch run URL differs")
          print(url)
          PY
          )
          status=$("${CURL}" --config - --fail-with-body --silent --show-error \
            --request GET --output "${EVIDENCE}/release-dispatch-run.json" \
            --write-out '%{http_code}' "${run_url}" <<EOF
          header = "Authorization: Bearer ${GITHUB_TOKEN}"
          header = "Accept: application/vnd.github+json"
          header = "X-GitHub-Api-Version: 2026-03-10"
          EOF
          )
          test "${status}" = "200"
          python -I -B "${HELPER}" verify-dispatch \
            --request "${EVIDENCE}/release-dispatch-request.json" \
            --response "${EVIDENCE}/release-dispatch-response.json" \
            --run-response "${EVIDENCE}/release-dispatch-run.json" \
            --durable-verification "${EVIDENCE}/durable-verification.json" \
            --receipt "${PORTABLE}/source-tag-creation-receipt.json" \
            --initiating-run-id "${GITHUB_RUN_ID}" \
            --initiating-run-attempt "${GITHUB_RUN_ATTEMPT}" \
            --actor "${GITHUB_ACTOR}" \
            > "${EVIDENCE}/release-dispatch-verification.json"

      - name: Retain exact three portable files as convenience only
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-tag-authority-portable-v1.9.0-${{ github.run_id }}
          path: ${{ runner.temp }}/source-tag-evidence/authority
          if-no-files-found: error
          retention-days: 90

      - name: Retain raw OCI readback as convenience only
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-tag-authority-readback-v1.9.0-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/source-tag-evidence/durable-readback
            ${{ runner.temp }}/source-tag-evidence/durable-verification.json
            ${{ runner.temp }}/source-tag-evidence/release-dispatch-request.json
            ${{ runner.temp }}/source-tag-evidence/release-dispatch-response.json
            ${{ runner.temp }}/source-tag-evidence/release-dispatch-run.json
            ${{ runner.temp }}/source-tag-evidence/release-dispatch-verification.json
          if-no-files-found: error
          retention-days: 90
