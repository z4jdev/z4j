# =============================================================================
# z4j Docker publish, from the published sdist
#
# Builds and publishes the multi-arch runtime image for a version that is
# ALREADY on PyPI, signs it keylessly with cosign, and attests its provenance.
#
# Why this exists alongside release-docker.yml
# --------------------------------------------
# release-docker.yml builds from a finalized production closure: pre-built
# wheelhouse, system-bundle and dashboard-bundle OCI artefacts that its prepare
# job resolves and its build job verifies. That closure is intentionally
# unfinalized (docker/production/locks/UNFINALIZED, and verify.py refuses under
# --require-finalized), and the Python wheelhouse producer has not been written,
# so that path cannot publish today. It is the stronger path and stays.
#
# This workflow is the ordinary one. It takes the sdist PyPI already serves,
# verifies it against the digest PyPI publishes, and builds the same Dockerfile
# from it. That gives a property worth having on its own: the image is built
# from the exact artefact `pip install` hands a user, not from a tree that
# merely resembles it.
#
# The sdist is required rather than incidental. The Dockerfile needs
# docker/vendor/{z4j-core,z4j-scheduler}, which packaging force-includes into
# the sdist and which does not exist in the git tree, and it refuses any other
# context rather than reaching for the network.
#
# Manual dispatch only. release-docker.yml already claims the tag-push trigger,
# and two publishers racing for the same `latest` is exactly the failure its
# concurrency comment describes.
# =============================================================================

name: publish-docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already published to PyPI, without the leading v"
        required: true
        type: string
      move_latest:
        description: "Also move the :latest tag (stable releases only)"
        required: false
        default: true
        type: boolean

concurrency:
  # Shares the publisher lock with release-docker.yml on purpose: whichever
  # publisher runs, only one may be deciding which digest owns `latest`.
  group: z4j-docker-publisher
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # keyless cosign and provenance attestation
  attestations: write

env:
  IMAGE: z4jdev/z4j

jobs:
  build:
    name: Build ${{ matrix.arch }} from the published sdist
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Resolve and verify the published sdist
        id: sdist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, urllib.request

          version = os.environ["VERSION"]
          url = f"https://pypi.org/pypi/z4j/{version}/json"
          with urllib.request.urlopen(url, timeout=60) as response:
              payload = json.load(response)

          sdists = [u for u in payload["urls"] if u["packagetype"] == "sdist"]
          if len(sdists) != 1:
              raise SystemExit(f"expected exactly one sdist for z4j {version}, found {len(sdists)}")
          entry = sdists[0]
          expected = entry["digests"]["sha256"]

          target = pathlib.Path("sdist.tar.gz")
          with urllib.request.urlopen(entry["url"], timeout=300) as response:
              target.write_bytes(response.read())

          actual = hashlib.sha256(target.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f"sdist digest mismatch: PyPI says {expected}, downloaded {actual}")

          print(f"verified {entry['filename']} sha256={actual}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"sha256={actual}\n")
              handle.write(f"filename={entry['filename']}\n")
          PY

      - name: Extract the sdist as the build context
        run: |
          set -euo pipefail
          mkdir -p context
          tar -xzf sdist.tar.gz -C context --strip-components=1
          # The Dockerfile's own precondition. Failing here is far clearer than
          # failing inside a build layer with the vendored trees missing.
          test -f context/Dockerfile
          test -f context/docker/vendor/z4j-core/pyproject.toml
          test -f context/docker/vendor/z4j-scheduler/pyproject.toml
          echo "dashboard files: $(find context/backend/src/z4j_brain/dashboard/dist -type f | wc -l)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # immutable ref; audited 2026-08-20
        with:
          version: v0.36.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # immutable ref; audited 2026-08-20
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push this architecture by digest
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # immutable ref; audited 2026-08-20
        with:
          context: ./context
          file: ./context/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            Z4J_VERSION=${{ inputs.version }}
          provenance: false
          # Pushed without a tag. The merge job below is the only thing that
          # decides which digest a public tag points at.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Record the digest for the merge job
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          test -n "${digest}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # immutable ref; audited 2026-08-20
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Tag, sign and attest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download the per-architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # immutable ref; audited 2026-08-20
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # immutable ref; audited 2026-08-20
        with:
          version: v0.36.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # immutable ref; audited 2026-08-20
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create the multi-arch tag
        id: manifest
        env:
          VERSION: ${{ inputs.version }}
          MOVE_LATEST: ${{ inputs.move_latest }}
        run: |
          set -euo pipefail
          cd /tmp/digests
          count=$(ls -1 | wc -l)
          if [ "${count}" -ne 2 ]; then
            echo "expected 2 architecture digests, found ${count}" >&2
            exit 1
          fi

          tags=(-t "${IMAGE}:${VERSION}")
          if [ "${MOVE_LATEST}" = "true" ]; then
            tags+=(-t "${IMAGE}:latest")
          fi

          # shellcheck disable=SC2046
          docker buildx imagetools create "${tags[@]}" \
            $(printf "${IMAGE}@sha256:%s " *)

          index_digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{println .Manifest.Digest}}' | head -1)
          test -n "${index_digest}"
          echo "index_digest=${index_digest}" >> "${GITHUB_OUTPUT}"
          echo "published ${IMAGE}:${VERSION} as ${index_digest}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # immutable ref; audited 2026-08-20
        with:
          cosign-release: v3.1.3

      - name: Sign the index and every architecture digest
        env:
          INDEX_DIGEST: ${{ steps.manifest.outputs.index_digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${IMAGE}@${INDEX_DIGEST}"
          for file in /tmp/digests/*; do
            cosign sign --yes "${IMAGE}@sha256:$(basename "${file}")"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # immutable ref; audited 2026-08-20
        with:
          subject-name: docker.io/${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.index_digest }}
          push-to-registry: true

      - name: Verify what the registry now serves
        env:
          VERSION: ${{ inputs.version }}
          INDEX_DIGEST: ${{ steps.manifest.outputs.index_digest }}
        run: |
          set -euo pipefail
          echo "--- manifest ---"
          docker buildx imagetools inspect "${IMAGE}:${VERSION}"

          echo "--- both architectures present? ---"
          platforms=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          echo "platforms: ${platforms}"
          case "${platforms}" in
            *linux/amd64*) ;;
            *) echo "amd64 missing from the published index" >&2; exit 1 ;;
          esac
          case "${platforms}" in
            *linux/arm64*) ;;
            *) echo "arm64 missing from the published index" >&2; exit 1 ;;
          esac

          echo "--- the signature is verifiable from the registry ---"
          cosign verify "${IMAGE}@${INDEX_DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          echo "signature verified"

          echo "--- the pulled image reports the version it claims ---"
          reported=$(docker run --rm --entrypoint z4j "${IMAGE}:${VERSION}" --version | head -1 | tr -d '[:space:]')
          echo "reported: ${reported}"
          if [ "${reported}" != "${VERSION}" ]; then
            echo "published image reports ${reported}, expected ${VERSION}" >&2
            exit 1
          fi
