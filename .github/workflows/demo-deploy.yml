name: demo-deploy

# Builds the demo.z4j.com SPA and checks the Cloudflare Pages tree it would
# ship. It NEVER deploys: no step talks to Cloudflare and no Cloudflare
# credential is referenced. A deploy token on this repository would be an
# unattended production deploy past every release gate, so none is wanted.
#
# The demo is deployed by the maintainer from the operator machine, with
# wrangler, through the site deployment helper (scripts/deploy-sites.sh in the
# development repository). That helper builds, verifies and freezes all three
# sites, and deploys only after an explicit operator authorization.
#
# The file path and the workflow name above are this workflow's GitHub
# identity, which .github/source_tag_authority.py pins, so both stay as they
# are even though the workflow no longer deploys. The same policy pins its
# GitHub state as disabled_manually, so GitHub runs it on neither trigger
# below. The development repository's release tests run the shape check
# below against sample build trees instead.

on:
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - ".github/workflows/demo-deploy.yml"
  workflow_dispatch:

# One in-flight check per branch. A new push cancels the previous run, whose
# commit the newer one supersedes.
concurrency:
  group: demo-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-check-demo:
    name: Build and check demo.z4j.com (never deploys)
    runs-on: ubuntu-24.04
    steps:
      # Nothing here pushes, so the checkout keeps no token on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # immutable ref; audited 2026-08-20
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # immutable ref; audited 2026-08-20
        with:
          version: 12.3.4

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # immutable ref; audited 2026-08-20
        with:
          node-version: "24.19.0"
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: pnpm install --frozen-lockfile

      - name: Build demo SPA
        working-directory: dashboard
        run: pnpm build:demo

      # Assert dist-demo/ has the bundle, the seed data tree and the Cloudflare
      # Pages routing files, and that the routing files keep the shape Pages
      # actually honors. 404.html must equal index.html: it turns the
      # single-page-application fallback off, so a missing asset is a 404
      # rather than a cached HTML shell. _redirects may hold only exact
      # "<path> / 200" rewrites followed by "<prefix>/* / 200" splats, with no
      # trailing slash (exact rules are not slash-normalized), no "$" router
      # segment, no rule on /* and no rule on a real file, which Pages would
      # rewrite even though the asset exists. _headers must put no-transform
      # on HTML, so the zone injects no script the demo CSP would block, and
      # detach and restate Cache-Control on /static/* and /demo-data/*.
      - name: Verify build output shape
        working-directory: dashboard
        run: |
          set -euo pipefail
          test -f dist-demo/index.html || { echo "::error::dist-demo/index.html missing"; exit 1; }
          test -f dist-demo/404.html || { echo "::error::dist-demo/404.html missing"; exit 1; }
          test -f dist-demo/_redirects || { echo "::error::dist-demo/_redirects missing"; exit 1; }
          test -f dist-demo/_headers || { echo "::error::dist-demo/_headers missing"; exit 1; }
          cmp -s dist-demo/index.html dist-demo/404.html \
            || { echo "::error::dist-demo/404.html differs from dist-demo/index.html"; exit 1; }
          if grep -n '^/\*' dist-demo/_redirects; then
            echo "::error::dist-demo/_redirects has a rule on /*, which Pages rejects as a loop"
            exit 1
          fi
          if grep -nEv '^(#.*)?$|^(/[^[:space:]/$*:]+)+(/\*)? / 200$' dist-demo/_redirects; then
            echo "::error::dist-demo/_redirects has a line that is not a '<path> / 200' rewrite"
            exit 1
          fi
          # Pages counts a rule as exact only until the first splat rule.
          if ! awk '
            /^\// { if ($1 ~ /\*$/) splat = 1; else if (splat) { print NR ": " $0; late = 1 } }
            END { exit late }
          ' dist-demo/_redirects; then
            echo "::error::dist-demo/_redirects has an exact rule after a splat rule"
            exit 1
          fi
          grep -qx '/projects/\* / 200' dist-demo/_redirects \
            || { echo "::error::dist-demo/_redirects lacks the /projects/* rewrite"; exit 1; }
          grep -qE '^/[^*]+ / 200$' dist-demo/_redirects \
            || { echo "::error::dist-demo/_redirects has no exact route rewrite"; exit 1; }
          # A rule must not cover anything the build ships, as a path or as the
          # extensionless URL Pages serves an .html file at.
          while read -r rule _ || [ -n "$rule" ]; do
            case "$rule" in /*) ;; *) continue ;; esac
            base="${rule%/\*}"
            if [ -e "dist-demo${base}" ] || [ -e "dist-demo${base}.html" ]; then
              echo "::error::dist-demo/_redirects rule ${rule} covers a real file in dist-demo"
              exit 1
            fi
          done < dist-demo/_redirects
          # Cache-Control is checked per _headers block, so a value set on the
          # wrong block cannot pass.
          awk '
            function need(path, header) {
              if (!((path, header) in have)) {
                print "::error::dist-demo/_headers " path " lacks \"" header "\""
                missing = 1
              }
            }
            /^#/ { next }
            /^[^ \t]/ { block = $1; next }
            {
              line = $0
              sub(/^[ \t]+/, "", line)
              sub(/[ \t]+$/, "", line)
              if (line != "") have[block, line] = 1
            }
            END {
              need("/*", "Cache-Control: public, max-age=0, must-revalidate, no-transform")
              need("/static/*", "! Cache-Control")
              need("/static/*", "Cache-Control: public, max-age=31536000, immutable")
              need("/demo-data/*", "! Cache-Control")
              need("/demo-data/*", "Cache-Control: public, max-age=300")
              exit missing
            }
          ' dist-demo/_headers || exit 1
          test -d dist-demo/demo-data/projects || { echo "::error::dist-demo/demo-data/projects missing"; exit 1; }
          test -f dist-demo/demo-data/projects/index.json || { echo "::error::projects/index.json missing"; exit 1; }
          test -f dist-demo/demo-data/auth/me.json || { echo "::error::auth/me.json missing"; exit 1; }
          # Each of the four canonical projects must have a tasks file.
          for slug in example.com fastapi.example.com django.example.com tasks.example.com; do
            test -f "dist-demo/demo-data/projects/${slug}/tasks.json" \
              || { echo "::error::demo-data/projects/${slug}/tasks.json missing"; exit 1; }
          done
          echo "Demo build output shape OK."
