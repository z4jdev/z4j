      - name: Keyless-sign and reverify exact finalization receipt bytes
        if: steps.finalization_durable.outputs.reused != 'true'
        run: |
          set -euo pipefail
          root=/tmp/rollback-compat-finalization
          receipt="${root}/rollback-compat-finalization-receipt.json"
          bundle="${root}/rollback-compat-finalization-receipt.sigstore.json"
          verification="${root}/rollback-compat-finalization-receipt-verification.txt"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-rollback-compat.yml@refs/heads/main"
          issuer=https://token.actions.githubusercontent.com
          cosign sign-blob \
            --yes \
            --bundle "${bundle}" \
            "${receipt}" > /dev/null
          cosign verify-blob \
            --bundle "${bundle}" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${receipt}" > "${verification}" 2>&1
          printf 'sigstore blob verification exit=0\n' >> "${verification}"
          test -s "${bundle}"
          test -s "${verification}"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("/tmp/rollback-compat-finalization")
          receipt = root / "rollback-compat-finalization-receipt.json"
          bundle = root / "rollback-compat-finalization-receipt.sigstore.json"
          verification = (
              root / "rollback-compat-finalization-receipt-verification.txt"
          )
          authority = root / "docker-hub-immutable-tag-authority.json"
          authority_authentication_path = (
              root
              / "docker-hub-immutable-tag-authority-authentication.json"
          )
          receipt_value = json.loads(receipt.read_bytes())
          authority_authentication = json.loads(
              authority_authentication_path.read_bytes()
          )
          json.loads(bundle.read_bytes())

          def descriptor(path: Path) -> dict[str, object]:
              raw = path.read_bytes()
              return {
                  "path": path.name,
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "size": len(raw),
              }

          receipt_authority = receipt_value.get("immutable_tag_authority")
          if not isinstance(receipt_authority, dict):
              raise SystemExit("finalization receipt immutable authority is absent")
          if receipt_authority.get("capture") != descriptor(authority):
              raise SystemExit("finalization receipt authority capture differs")
          if receipt_authority.get("authentication") != authority_authentication:
              raise SystemExit(
                  "finalization receipt authority authentication differs"
              )

          authentication = {
              "format": "z4j-rollback-compat-finalization-authentication-v1",
              "result": "pass",
              "method": "sigstore-keyless-cosign-sign-blob",
              "cosign_version": "3.1.3",
              "identity": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/"
                  ".github/workflows/release-rollback-compat.yml"
                  "@refs/heads/main"
              ),
              "issuer": "https://token.actions.githubusercontent.com",
              "subject": descriptor(receipt),
              "bundle": descriptor(bundle),
              "verification": {
                  **descriptor(verification),
                  "verified": True,
              },
              "immutable_tag_authority": {
                  "capture": descriptor(authority),
                  "authentication": descriptor(
                      authority_authentication_path
                  ),
              },
          }
          raw = (
              json.dumps(authentication, sort_keys=True, separators=(",", ":"), ensure_ascii=True)
              + "\n"
          ).encode("ascii")
          (root / "rollback-compat-finalization-authentication.json").write_bytes(
              raw
          )
          PY

