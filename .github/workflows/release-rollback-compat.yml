          )
          finalization_raw = finalization_receipt_path.read_bytes()
          finalization_receipt = json.loads(finalization_raw)
          finalization_authentication_raw = (
              finalization_root
              / "rollback-compat-finalization-authentication.json"
          ).read_bytes()
          finalization_authentication = json.loads(
              finalization_authentication_raw
          )

          def descriptor(path: Path) -> dict[str, object]:
              raw = path.read_bytes()
              return {
                  "path": path.name,
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "size": len(raw),
              }

          authority_path = (
              finalization_root
              / "docker-hub-immutable-tag-authority.json"
          )
          authority_authentication_path = (
              finalization_root
              / "docker-hub-immutable-tag-authority-authentication.json"
          )
          prewrite_authority_path = (
              promotion_root
              / "docker-hub-immutable-tag-authority-prewrite.json"
          )
          bundle_reverification_path = (
              promotion_root
              / "docker-hub-immutable-tag-authority-promotion-verification.txt"
          )
          authority_raw = authority_path.read_bytes()
          prewrite_authority_raw = prewrite_authority_path.read_bytes()
          if authority_raw != prewrite_authority_raw:
              raise SystemExit(
                  "prewrite immutable-tag authority differs from signed capture"
              )
          authority_authentication = json.loads(
              authority_authentication_path.read_bytes()
          )
          receipt_authority = finalization_receipt.get(
              "immutable_tag_authority"
          )
          if not isinstance(receipt_authority, dict) or set(
              receipt_authority
          ) != {"policy", "capture", "authentication"}:
              raise SystemExit(
                  "finalization receipt immutable-tag authority keys differ"
              )
          if receipt_authority["capture"] != descriptor(authority_path):
              raise SystemExit(
                  "finalization receipt immutable-tag capture differs"
              )
          if (
              receipt_authority["authentication"]
              != authority_authentication
          ):
              raise SystemExit(
                  "finalization receipt immutable-tag authentication differs"
              )
          expected_authentication_binding = {
              "capture": descriptor(authority_path),
              "authentication": descriptor(
                  authority_authentication_path
              ),
          }
          if finalization_authentication.get(
              "immutable_tag_authority"
          ) != expected_authentication_binding:
              raise SystemExit(
                  "finalization authentication immutable authority differs"
              )
          if bundle_reverification_path.stat().st_size == 0:
              raise SystemExit(
                  "promotion immutable-authority bundle reverification is empty"
              )
          if finalization_authentication.get("result") != "pass":
              raise SystemExit("finalization receipt authentication did not pass")
          if finalization_authentication.get("subject", {}).get("sha256") != (
              hashlib.sha256(finalization_raw).hexdigest()
