              capture_output=True,
              text=True,
          ).stdout.strip()
          if run_id <= 0 or qualification_run_id <= 0:
              raise SystemExit("promotion run authority is invalid")
          if repository != "z4jdev/z4j" or ref != "refs/heads/main":
              raise SystemExit("promotion repository or ref authority differs")
          if re.fullmatch(r"[0-9a-f]{40}", head_sha) is None:
              raise SystemExit("promotion source SHA is invalid")
          if re.fullmatch(r"[0-9a-f]{40}", head_tree) is None:
              raise SystemExit("promotion source tree is invalid")
          source = finalization_receipt.get("source")
          if source != {"git_sha": head_sha, "git_tree": head_tree}:
              raise SystemExit("promotion source differs from finalization authority")
          if finalization_receipt.get("qualification_run_id") != qualification_run_id:
              raise SystemExit("promotion qualification run differs from finalization")
          qualification_source = finalization_receipt.get("qualification_source")
          if (
              not isinstance(qualification_source, dict)
              or qualification_source.get("repository") != repository
              or qualification_source.get("workflow_path") != workflow_path
          ):
              raise SystemExit("promotion qualification source authority differs")
          promotion_authority = {
              "run_id": run_id,
              "repository": repository,
              "workflow_path": workflow_path,
              "ref": ref,
              "head_sha": head_sha,
              "head_tree": head_tree,
              "qualification_run_id": qualification_run_id,
          }
          evidence = {
              "format": "z4j-rollback-compat-promotion-evidence-v1",
              "result": "pass",
              "promotion_authority": promotion_authority,
              "finalization_receipt_sha256": hashlib.sha256(
                  finalization_raw
              ).hexdigest(),
              "qualification_run_id": int(os.environ["QUALIFICATION_RUN_ID"]),
              "public_reference": (
                  f"{candidate['repository']}:{candidate['public_tag']}"
              ),
              "expected_digest": candidate["index"]["digest"],
              "observed_digest": observed,
              "status": "exact",
              "transition": transition,
              "immutable_tag_authority": {
                  "policy": receipt_authority["policy"],
                  "finalization_capture": receipt_authority["capture"],
                  "prewrite_reread": descriptor(prewrite_authority_path),
                  "bundle_reverification": {
                      **descriptor(bundle_reverification_path),
                      "verified": True,
                  },
                  "exact_match": True,
              },
              "finalization_authentication": finalization_authentication,
          }
          raw = (
              json.dumps(evidence, sort_keys=True, separators=(",", ":"), ensure_ascii=True) + "\n"
          ).encode("ascii")
          path = promotion_root / "rollback-compat-promotion-evidence.json"
          path.write_bytes(raw)
          digest = hashlib.sha256(raw).hexdigest()
          (promotion_root / "rollback-compat-promotion-evidence.sha256").write_text(
              f"{digest}  {path.name}\n",
              encoding="ascii",
          )
          PY

      - name: Keyless-sign and reverify exact promotion evidence bytes
        run: |
          set -euo pipefail
          root=/tmp/rollback-compat-promotion
          subject="${root}/rollback-compat-promotion-evidence.json"
          bundle="${root}/rollback-compat-promotion-evidence.sigstore.json"
          verification="${root}/rollback-compat-promotion-evidence-verification.txt"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-rollback-compat.yml@refs/heads/main"
          issuer=https://token.actions.githubusercontent.com
          cosign sign-blob \
            --yes \
            --bundle "${bundle}" \
            "${subject}" > /dev/null
          cosign verify-blob \
            --bundle "${bundle}" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${subject}" > "${verification}" 2>&1
          printf 'sigstore blob verification exit=0\n' >> "${verification}"
          test -s "${bundle}"
          test -s "${verification}"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("/tmp/rollback-compat-promotion")
          subject = root / "rollback-compat-promotion-evidence.json"
          bundle = root / "rollback-compat-promotion-evidence.sigstore.json"
          verification = (
              root / "rollback-compat-promotion-evidence-verification.txt"
          )
          json.loads(bundle.read_bytes())

          def descriptor(path: Path) -> dict[str, object]:
              raw = path.read_bytes()
              return {
                  "path": path.name,
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "size": len(raw),
              }

          authentication = {
              "format": "z4j-rollback-compat-promotion-authentication-v1",
              "result": "pass",
              "method": "sigstore-keyless-cosign-sign-blob",
              "cosign_version": "3.1.3",
              "identity": (
                  f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/"
                  ".github/workflows/release-rollback-compat.yml"
                  "@refs/heads/main"
              ),
              "issuer": "https://token.actions.githubusercontent.com",
              "subject": descriptor(subject),
              "bundle": descriptor(bundle),
              "verification": {
                  **descriptor(verification),
                  "verified": True,
              },
          }
          raw = (
              json.dumps(authentication, sort_keys=True, separators=(",", ":"), ensure_ascii=True)
              + "\n"
          ).encode("ascii")
          (root / "rollback-compat-promotion-authentication.json").write_bytes(
              raw
          )
          PY

      - name: Publish and raw-readback durable promotion OCI evidence
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          root=/tmp/rollback-compat-promotion
          index_digest=$(python3 -c \
            'import json; print(json.load(open("'"${RECIPE}"'/manifest.json"))["candidate_image"]["index"]["digest"])')
          index_size=$(python3 -c \
            'import json; print(json.load(open("'"${RECIPE}"'/manifest.json"))["candidate_image"]["index"]["size"])')
          python3 "${RECIPE}/durable_evidence.py" publish \
            --manifest "${RECIPE}/manifest.json" \
            --stage promotion \
            --subject-digest "${index_digest}" \
            --subject-size "${index_size}" \
            --receipt "${root}/rollback-compat-promotion-evidence.json" \
            --bundle "${root}/rollback-compat-promotion-evidence.sigstore.json" \
            --authentication "${root}/rollback-compat-promotion-authentication.json" \
            --payload-root "${root}" \
            --predecessor-record /tmp/rollback-compat-finalization/durable/finalization/record.json \
            --output-dir "${root}/durable/promotion"

      - name: Emit, keyless-sign, and authenticate release evidence index
        run: |
          set -euo pipefail
          root=/tmp/rollback-compat-promotion
          subject="${root}/rollback-compat-release-evidence-index.json"
          bundle="${root}/rollback-compat-release-evidence-index.sigstore.json"
          verification="${root}/rollback-compat-release-evidence-index-verification.txt"
          authentication="${root}/rollback-compat-release-evidence-index-authentication.json"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-rollback-compat.yml@refs/heads/main"
          issuer=https://token.actions.githubusercontent.com
          python3 "${RECIPE}/durable_evidence.py" make-index \
            --manifest "${RECIPE}/manifest.json" \
            --record /tmp/rollback-compat-qualification/durable/qualification/record.json \
            --record /tmp/rollback-compat-finalization/durable/finalization/record.json \
            --record "${root}/durable/promotion/record.json" \
            --output "${subject}"
          cosign sign-blob --yes --bundle "${bundle}" "${subject}" > /dev/null
          cosign verify-blob \
            --bundle "${bundle}" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${subject}" > "${verification}" 2>&1
          printf 'sigstore blob verification exit=0\n' >> "${verification}"
          test -s "${bundle}"
          test -s "${verification}"
          python3 "${RECIPE}/durable_evidence.py" authentication \
            --manifest "${RECIPE}/manifest.json" \
            --stage release-index \
            --format z4j-rollback-compat-release-evidence-index-authentication-v1 \
            --subject "${subject}" \
            --bundle "${bundle}" \
            --verification "${verification}" \
            --identity "${identity}" \
            --issuer "${issuer}" \
            --output "${authentication}"

      - name: Publish and raw-readback durable release evidence index
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          root=/tmp/rollback-compat-promotion
          index_digest=$(python3 -c \
            'import json; print(json.load(open("'"${RECIPE}"'/manifest.json"))["candidate_image"]["index"]["digest"])')
          index_size=$(python3 -c \
            'import json; print(json.load(open("'"${RECIPE}"'/manifest.json"))["candidate_image"]["index"]["size"])')
          python3 "${RECIPE}/durable_evidence.py" publish \
            --manifest "${RECIPE}/manifest.json" \
            --stage release-index \
            --subject-digest "${index_digest}" \
            --subject-size "${index_size}" \
            --receipt "${root}/rollback-compat-release-evidence-index.json" \
            --bundle "${root}/rollback-compat-release-evidence-index.sigstore.json" \
            --authentication "${root}/rollback-compat-release-evidence-index-authentication.json" \
            --payload-root "${root}" \
            --predecessor-record "${root}/durable/promotion/record.json" \
            --output-dir "${root}/durable/release-index"

      - name: Upload exact-tag promotion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rollback-compat-promotion-${{ github.run_id }}
          path: /tmp/rollback-compat-promotion
          if-no-files-found: error
          retention-days: 90
