              + "\n"
          ).encode("ascii")
          (
              Path("/tmp/rollback-compat-finalization")
              / "docker-hub-immutable-tag-authority.json"
          ).write_bytes(raw)
          PY

      - name: Keyless-sign and reverify exact Docker Hub immutable-tag authority
        run: |
