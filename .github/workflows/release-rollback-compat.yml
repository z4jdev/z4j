          authority_bundle_path = (
              root / "docker-hub-immutable-tag-authority.sigstore.json"
          )
          authority_verification_path = (
              root / "docker-hub-immutable-tag-authority-verification.txt"
          )
          authority_authentication_path = (
              root
              / "docker-hub-immutable-tag-authority-authentication.json"
          )
          authority_raw = authority_path.read_bytes()
          authority = json.loads(authority_raw)
          canonical_authority = (
              json.dumps(
                  authority,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
              )
              + "\n"
          ).encode("ascii")
          if authority_raw != canonical_authority:
              raise SystemExit("immutable-tag authority is not canonical newline JSON")
          expected_settings = {
              "enabled": True,
              "rules": [os.environ["IMMUTABLE_TAG_RULE"]],
          }
          expected_authority = {
              "format": "z4j-docker-hub-immutable-tag-authority-v1",
              "result": "pass",
              "source": {
                  "api": os.environ["HUB_API_REPOSITORY"],
                  "operation": "GetRepository",
                  "authentication": "docker-hub-short-lived-bearer",
              },
              "repository": {
                  "namespace": "z4jdev",
                  "name": "z4j",
              },
              "immutable_tags_settings": expected_settings,
              "target_tag": os.environ["TARGET_TAG"],
          }
          if authority != expected_authority:
              raise SystemExit("signed immutable-tag authority differs")

          authority_authentication_raw = (
              authority_authentication_path.read_bytes()
          )
          authority_authentication = json.loads(
              authority_authentication_raw
          )
          canonical_authority_authentication = (
              json.dumps(
                  authority_authentication,
                  sort_keys=True,
                  separators=(",", ":"),
                  ensure_ascii=True,
              )
              + "\n"
          ).encode("ascii")
          if (
              authority_authentication_raw
              != canonical_authority_authentication
          ):
              raise SystemExit(
                  "immutable-tag authority authentication is not canonical"
              )
          json.loads(authority_bundle_path.read_bytes())
          identity = (
              f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/"
              ".github/workflows/release-rollback-compat.yml"
              "@refs/heads/main"
          )
          expected_authority_authentication = {
              "format": (
                  "z4j-docker-hub-immutable-tag-authority-authentication-v1"
              ),
              "result": "pass",
              "method": "sigstore-keyless-cosign-sign-blob",
              "cosign_version": "3.1.3",
              "identity": identity,
              "issuer": "https://token.actions.githubusercontent.com",
              "subject": descriptor(authority_path),
              "bundle": descriptor(authority_bundle_path),
