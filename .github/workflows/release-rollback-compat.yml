          cosign verify-blob \
            --bundle "${bundle}" \
            --certificate-identity "${identity}" \
            --certificate-oidc-issuer "${issuer}" \
            "${authority}" > "${verification}" 2>&1
          printf 'sigstore blob verification exit=0\n' >> "${verification}"
          test -s "${authority}"
          test -s "${bundle}"
          test -s "${verification}"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

