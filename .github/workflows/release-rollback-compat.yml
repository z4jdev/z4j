              ),
              "require_authenticated_readback": True,
              "require_prewrite_exact_reread": True,
              "require_target_absent": True,
          }
          if (
              not isinstance(policy, dict)
              or policy != expected_policy
              or policy.get("enabled") is not True
              or policy.get("require_authenticated_readback") is not True
              or policy.get("require_prewrite_exact_reread") is not True
              or policy.get("require_target_absent") is not True
          ):
              raise SystemExit("manifest immutable-tag authority policy differs")

          authority = {
              "format": "z4j-docker-hub-immutable-tag-authority-v1",
              "result": "pass",
              "source": {
                  "api": os.environ["HUB_API_REPOSITORY"],
                  "operation": "GetRepository",
                  "authentication": "docker-hub-short-lived-bearer",
              },
              "repository": {
                  "namespace": "z4jdev",
                  "name": "z4j",
