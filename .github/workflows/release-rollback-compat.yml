          if not re.fullmatch(r"[0-9a-f]{40}", git_tree):
              raise SystemExit("final source tree is invalid")
          qualification_sha = hashlib.sha256(qualification_raw).hexdigest()
          if qualification_sha != os.environ["QUALIFICATION_RECEIPT_SHA256"]:
              raise SystemExit("qualification receipt changed before finalization")

