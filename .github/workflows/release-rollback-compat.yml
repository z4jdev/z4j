              "rules",
              "required_behavior",
          )
          authority_receipt_policy = {
              key: authority_policy_lock[key]
              for key in receipt_policy_keys
          }
          if authority_receipt_policy != {
              "provider": "docker-hub",
              "api": os.environ["HUB_API_REPOSITORY"],
              "repository": "z4jdev/z4j",
              "target_tag": os.environ["TARGET_TAG"],
              "enabled": True,
              "rules": [os.environ["IMMUTABLE_TAG_RULE"]],
              "required_behavior": (
                  "matched-tag-cannot-be-overwritten-or-deleted"
              ),
          }:
              raise SystemExit("finalization immutable-tag receipt policy differs")

          reread_root = root / "registry-reread"
          index_path = reread_root / "candidate.index.oci.json"
          index_raw = index_path.read_bytes()
          platform_rereads = {}
          for arch in ("amd64", "arm64"):
              descriptors = {}
              for descriptor, filename in (
                  ("manifest", "manifest.oci.json"),
                  ("config", "config.oci.json"),
              ):
                  path = reread_root / "native" / arch / filename
                  raw = path.read_bytes()
                  sealed = candidate["platforms"][arch][descriptor]
                  actual = {
                      "digest": "sha256:" + hashlib.sha256(raw).hexdigest(),
                      "size": len(raw),
                      "sha256": hashlib.sha256(raw).hexdigest(),
                  }
                  if actual["digest"] != sealed["digest"] or actual["size"] != sealed["size"]:
                      raise SystemExit(f"{arch} {descriptor} reread differs from seal")
                  descriptors[descriptor] = actual
              platform_rereads[arch] = descriptors

          proof_root = root / "proofs"
          proofs = {}
          for label, filename in (
              ("signature", "signature-verification.json"),
              ("sbom_attestation", "sbom-attestation-verification.json"),
              ("provenance", "provenance-verification.json"),
          ):
              path = proof_root / filename
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"{label} reread proof is absent")
              proofs[label] = {
                  "verified": True,
                  "sha256": sha(path),
              }
          proofs["final_tag_exact"] = {
              "status": "pending",
              "expected_digest": candidate["index"]["digest"],
              "enforcement": (
                  "docker-hub-immutable-create-only-after-receipt"
              ),
          }
          receipt = {
              "format": "z4j-rollback-compat-finalization-receipt-v1",
              "result": "pass",
              "source": {
                  "git_sha": git_sha,
                  "git_tree": git_tree,
              },
              "manifest_sha256": hashlib.sha256(manifest_raw).hexdigest(),
              "qualification_receipt_sha256": qualification_sha,
              "qualification_run_id": int(os.environ["QUALIFICATION_RUN_ID"]),
              "qualification_source": {
                  "git_sha": run["head_sha"],
                  "repository": run["head_repository"]["full_name"],
                  "workflow_path": run["path"],
              },
              "candidate_image": {
                  "repository": candidate["repository"],
                  "public_tag": candidate["public_tag"],
                  "index": candidate["index"],
                  "platforms": candidate["platforms"],
              },
              "public_reference": (
                  f"{candidate['repository']}:{candidate['public_tag']}"
              ),
              "registry_reread": {
                  "original_reference": (
                      f"{candidate['repository']}@{candidate['index']['digest']}"
                  ),
                  "index": {
                      "digest": "sha256:" + hashlib.sha256(index_raw).hexdigest(),
                      "size": len(index_raw),
                      "sha256": hashlib.sha256(index_raw).hexdigest(),
                  },
                  "platforms": platform_rereads,
                  "exact_original_bytes": True,
              },
              "immutable_tag_authority": {
                  "policy": authority_receipt_policy,
                  "capture": descriptor(authority_path),
                  "authentication": authority_authentication,
              },
              "proofs": proofs,
              "authorization": {
                  "tag_transition": (
                      "create-only-under-preconfigured-docker-hub-immutable-rule"
                  ),
                  "receipt_uploaded_before_tag_mutation": True,
                  "source_candidate_finalized": True,
                  "target_tag_required_absent": True,
                  "immutable_tag_authority_authenticated": True,
              },
              "receipt_authentication": {
                  "method": "sigstore-keyless-cosign-sign-blob",
                  "identity": (
                      f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/"
                      ".github/workflows/release-rollback-compat.yml"
                      "@refs/heads/main"
                  ),
                  "issuer": "https://token.actions.githubusercontent.com",
                  "bundle_file": (
                      "rollback-compat-finalization-receipt.sigstore.json"
                  ),
                  "verification_file": (
                      "rollback-compat-finalization-receipt-verification.txt"
                  ),
              },
          }
          if receipt["registry_reread"]["index"]["digest"] != candidate["index"]["digest"]:
              raise SystemExit("final reread index digest differs from candidate")
          if receipt["registry_reread"]["index"]["size"] != candidate["index"]["size"]:
              raise SystemExit("final reread index size differs from candidate")
          raw = (
              json.dumps(receipt, sort_keys=True, separators=(",", ":"), ensure_ascii=True) + "\n"
          ).encode("ascii")
          path = root / "rollback-compat-finalization-receipt.json"
          path.write_bytes(raw)
          digest = hashlib.sha256(raw).hexdigest()
          (root / "rollback-compat-finalization-receipt.sha256").write_text(
              f"{digest}  {path.name}\n",
              encoding="ascii",
          )
          print(f"finalization receipt sha256={digest}")
          PY

      - name: Reuse exact prior durable finalization evidence when present
        id: finalization_durable
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          root=/tmp/rollback-compat-finalization
          durable="${RECIPE}/durable_evidence.py"
          index_digest=$(python3 -c \
            'import json; print(json.load(open("'"${RECIPE}"'/manifest.json"))["candidate_image"]["index"]["digest"])')
          index_size=$(python3 -c \
            'import json; print(json.load(open("'"${RECIPE}"'/manifest.json"))["candidate_image"]["index"]["size"])')
          set +e
          python3 "${durable}" discover \
            --manifest "${RECIPE}/manifest.json" \
            --stage finalization \
            --subject-digest "${index_digest}" \
            --subject-size "${index_size}" \
            --predecessor-record /tmp/rollback-compat-qualification/durable/qualification/record.json \
            --output-dir "${root}/durable/finalization" \
            > "${root}/durable-finalization-replay.json"
          status=$?
          set -e
          case "${status}" in
            0)
              python3 - \
                "${root}/rollback-compat-finalization-receipt.json" \
                "${root}/durable/finalization/readback/receipt.json" <<'PY'
          import copy
          import json
          import sys
          from pathlib import Path

          current = json.loads(Path(sys.argv[1]).read_bytes())
          replayed = json.loads(Path(sys.argv[2]).read_bytes())

          def stable_receipt(value: object) -> dict[str, object]:
              if not isinstance(value, dict):
                  raise SystemExit("finalization replay receipt is not an object")
              result = copy.deepcopy(value)
              authority = result.get("immutable_tag_authority")
              if not isinstance(authority, dict) or set(authority) != {
                  "policy",
                  "capture",
                  "authentication",
              }:
                  raise SystemExit(
                      "finalization replay immutable authority keys differ"
                  )
              authentication = authority.pop("authentication")
              if not isinstance(authentication, dict):
                  raise SystemExit(
                      "finalization replay authority authentication is absent"
                  )
              return result

          if stable_receipt(replayed) != stable_receipt(current):
