      - name: Emit detached pre-promotion finalization receipt
        env:
          QUALIFICATION_RUN_ID: ${{ needs.prepare.outputs.qualification_run_id }}
          QUALIFICATION_RECEIPT_SHA256: ${{ steps.qualification.outputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          export FINAL_GIT_TREE
          FINAL_GIT_TREE=$(git rev-parse "${GITHUB_SHA}^{tree}")
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          root = Path("/tmp/rollback-compat-finalization")
          root.mkdir(exist_ok=True)
          recipe = Path(os.environ["RECIPE"])
          manifest_path = recipe / "manifest.json"
          manifest_raw = manifest_path.read_bytes()
          lock = json.loads(manifest_raw)
          candidate = lock["candidate_image"]
          authority_policy_lock = lock["publication_gate"][
              "immutable_tag_authority"
          ]
          qualification_raw = Path(
              "/tmp/rollback-compat-qualification/"
              "rollback-compat-qualification-receipt.json"
          ).read_bytes()
          run = json.loads(
              Path("/tmp/rollback-compat-qualification-run.json").read_text(
                  encoding="utf-8"
              )
          )

          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def descriptor(path: Path) -> dict[str, object]:
              raw = path.read_bytes()
              return {
                  "path": path.name,
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "size": len(raw),
              }

          git_sha = os.environ["GITHUB_SHA"]
