# =============================================================================
# Protected promotion of a previously qualified z4j production image.
#
# This workflow never builds. It consumes the byte-signed qualification
# receipt from a successful tag-triggered release-docker run, independently
# refetches the candidate index/leaves/configs, verifies the detached receipt,
# proves Docker Hub's immutable release-tag rule, and only then creates the
# public version tag. The production-release environment must require a
# distinct human reviewer and prevent self-review.
# =============================================================================

name: promote-release-docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Qualified SemVer to promote, without the leading v"
        required: true
        type: string
      qualification_run_id:
        description: "Successful tag-triggered release-docker workflow run ID"
        required: true
        type: string

concurrency:
  group: z4j-docker-publisher
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  id-token: write

env:
  IMAGE: z4jdev/z4j
  VERSION: ${{ inputs.version }}
  QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}

jobs:
  promote:
    name: Reverify and promote qualified digest
    runs-on: ubuntu-24.04
    environment: production-release
    steps:
      - name: Validate promotion inputs
        run: |
          if [ "${GITHUB_REF}" != refs/heads/main ]; then
            echo "::error::protected promotion must execute from refs/heads/main"
            exit 1
          fi
          if ! printf '%s' "${VERSION}" \
            | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::invalid SemVer input '${VERSION}'"
            exit 1
          fi
          if ! printf '%s' "${QUALIFICATION_RUN_ID}" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::qualification run ID must be a positive integer"
            exit 1
          fi

      - name: Checkout exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # immutable ref; audited 2026-08-20
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0

      - name: Resolve and verify release source authority
        id: source
        run: |
          RELEASE_SHA=$(git rev-parse HEAD)
          RELEASE_TREE=$(git rev-parse 'HEAD^{tree}')
          TAG_SHA=$(git rev-list -n 1 "refs/tags/v${VERSION}")
          if [ "${TAG_SHA}" != "${RELEASE_SHA}" ]; then
            echo "::error::checked-out source is not the exact release tag"
            exit 1
          fi
          python3 docker/production/verify.py source \
            --manifest docker/production/manifest.json \
            --repo-root . \
            --require-finalized \
            --release-commit "${RELEASE_SHA}" \
            --release-tree "${RELEASE_TREE}" \
            --github-output "${GITHUB_OUTPUT}"
          {
            echo "release_sha=${RELEASE_SHA}"
            echo "release_tree=${RELEASE_TREE}"
          } >> "${GITHUB_OUTPUT}"

      - name: Authenticate qualification workflow run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output /tmp/qualification-run.json \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${QUALIFICATION_RUN_ID}"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          run = json.loads(Path("/tmp/qualification-run.json").read_text(encoding="utf-8"))
          expected_path = ".github/workflows/release-docker.yml"
          if (
              run.get("id") != int(os.environ["QUALIFICATION_RUN_ID"])
              or run.get("path") != expected_path
              or run.get("event") != "push"
              or run.get("status") != "completed"
              or run.get("conclusion") != "success"
              or run.get("head_sha") != os.environ["RELEASE_SHA"]
              or run.get("head_branch") != f"v{os.environ['VERSION']}"
          ):
              raise SystemExit(
                  "qualification run is not the successful tag-triggered release-docker authority"
              )
          PY

      - name: Download authenticated qualification receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # immutable ref; audited 2026-08-20
        with:
          name: production-finalization-attestation-${{ inputs.version }}
          path: /tmp/z4j-promotion
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.qualification_run_id }}

      - name: Download qualification SBOM and scanner evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # immutable ref; audited 2026-08-20
        with:
          name: sbom-${{ inputs.version }}
          path: /tmp/z4j-qualified-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.qualification_run_id }}

      - name: Validate exact receipt artifact and source bindings
        id: receipt
        env:
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
          RELEASE_TREE: ${{ steps.source.outputs.release_tree }}
          MANIFEST_SHA256: ${{ steps.source.outputs.production_manifest_sha256 }}
          SOURCE_PROJECTION_SHA256: ${{ steps.source.outputs.production_source_projection_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import stat
          from pathlib import Path

          root = Path("/tmp/z4j-promotion")
          expected_files = {
              "production-finalization.json",
              "production-finalization.bundle.json",
              "production-finalization.attestation.jsonl",
              "staging-index.json",
          }
          entries = list(root.iterdir())
          if {entry.name for entry in entries} != expected_files:
              raise SystemExit("qualification artifact file inventory differs")
          for entry in entries:
              observed = entry.stat(follow_symlinks=False)
              if entry.is_symlink() or not stat.S_ISREG(observed.st_mode):
                  raise SystemExit(f"unsafe qualification artifact entry: {entry.name}")

          receipt_path = root / "production-finalization.json"
          receipt_raw = receipt_path.read_bytes()
          receipt = json.loads(receipt_raw)
          canonical = json.dumps(
              receipt, sort_keys=True, separators=(",", ":"), ensure_ascii=True
          ).encode("ascii") + b"\n"
          if receipt_raw != canonical:
              raise SystemExit("production finalization receipt is not canonical JSON")
          expected_keys = {
              "format",
              "release",
              "release_git_commit",
              "release_git_tree",
              "manifest_sha256",
              "production_source_projection_sha256",
              "candidate_index",
              "signature_verifier",
              "dashboard_sbom",
              "native",
              "native_receipts",
          }
          if set(receipt) != expected_keys:
              raise SystemExit("production finalization receipt shape differs")
          if (
              receipt["format"] != "z4j-production-container-finalization-v1"
              or receipt["release"] != os.environ["VERSION"]
              or receipt["release_git_commit"] != os.environ["RELEASE_SHA"]
              or receipt["release_git_tree"] != os.environ["RELEASE_TREE"]
              or receipt["manifest_sha256"] != os.environ["MANIFEST_SHA256"]
              or receipt["production_source_projection_sha256"]
              != os.environ["SOURCE_PROJECTION_SHA256"]
          ):
              raise SystemExit("production finalization receipt source bindings differ")
          candidate = receipt["candidate_index"]
          if set(candidate) != {"image", "digest", "sha256", "size"}:
              raise SystemExit("candidate index receipt shape differs")
          if candidate["image"] != "docker.io/z4jdev/z4j":
              raise SystemExit("candidate index repository identity differs")
          digest = candidate["digest"]
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
              raise SystemExit("candidate index digest is malformed")
          index_raw = (root / "staging-index.json").read_bytes()
          if (
              candidate["sha256"] != hashlib.sha256(index_raw).hexdigest()
              or candidate["size"] != len(index_raw)
              or digest != "sha256:" + hashlib.sha256(index_raw).hexdigest()
          ):
              raise SystemExit("candidate index bytes differ from their receipt")
          native = receipt["native"]
          native_receipts = receipt["native_receipts"]
          contract_manifest = json.loads(
              Path("docker/production/manifest.json").read_text(encoding="utf-8")
          )
          if receipt["signature_verifier"] != contract_manifest["signature_verifier"]:
              raise SystemExit("production signature-verifier authority differs")
          if set(native) != {"amd64", "arm64"} or set(native_receipts) != {
              "amd64",
              "arm64",
          }:
              raise SystemExit("native production receipt matrix differs")
          leaf_digests = {}
          evidence_root = Path("/tmp/z4j-qualified-evidence")
          expected_evidence_files = {
              "sbom.amd64.cyclonedx.json",
              "sbom.amd64.spdx.json",
              "sbom.arm64.cyclonedx.json",
              "sbom.arm64.spdx.json",
              "sbom.npm.cyclonedx.json",
              "sbom.npm.spdx.json",
              "cadence.amd64.json",
              "cadence.arm64.json",
              "dashboard-replay.amd64.json",
              "dashboard-replay.amd64.stdout",
              "dashboard-replay.amd64.stderr",
              "dashboard-replay.arm64.json",
              "dashboard-replay.arm64.stdout",
              "dashboard-replay.arm64.stderr",
              "production.amd64.json",
              "production.arm64.json",
              "signature-verifier.amd64.json",
              "signature-verifier.arm64.json",
              "service-smoke.amd64.json",
              "service-smoke.amd64.log",
              "service-smoke.amd64.inspect.json",
              "service-smoke.arm64.json",
              "service-smoke.arm64.log",
              "service-smoke.arm64.inspect.json",
              "trivy.amd64.json",
              "trivy.arm64.json",
              "trivy-version.amd64.txt",
              "trivy-version.arm64.txt",
              "trivy-database.amd64.json",
              "trivy-database.arm64.json",
              "trivy-database-metadata.amd64.json",
              "trivy-database-metadata.arm64.json",
              "production-finalization.json",
          }
          evidence_entries = list(evidence_root.iterdir())
          if {
              entry.name for entry in evidence_entries if entry.is_file()
          } != expected_evidence_files or {
              entry.name for entry in evidence_entries if entry.is_dir()
          } != {
              "trivy-database-cache.amd64",
              "trivy-database-cache.arm64",
          }:
              raise SystemExit("qualification evidence artifact inventory differs")
          for entry in evidence_entries:
              observed = entry.stat(follow_symlinks=False)
              if entry.is_symlink() or not (
                  stat.S_ISREG(observed.st_mode) or stat.S_ISDIR(observed.st_mode)
              ):
                  raise SystemExit(f"unsafe qualification evidence entry: {entry.name}")

          def seal(path: Path) -> dict[str, object]:
              payload = path.read_bytes()
              return {"sha256": hashlib.sha256(payload).hexdigest(), "size": len(payload)}

          retained_receipt = (evidence_root / "production-finalization.json").read_bytes()
          if retained_receipt != receipt_raw:
              raise SystemExit("qualification evidence carries different receipt bytes")
          for arch in ("amd64", "arm64"):
              value = native[arch]
              native_raw = (evidence_root / f"production.{arch}.json").read_bytes()
              native_seal = {
                  "sha256": hashlib.sha256(native_raw).hexdigest(),
                  "size": len(native_raw),
              }
              if native_seal != native_receipts[arch] or json.loads(native_raw) != value:
                  raise SystemExit(f"native {arch} receipt bytes differ")
              if (
                  value.get("platform") != f"linux/{arch}"
                  or value.get("release_git_commit") != os.environ["RELEASE_SHA"]
                  or value.get("release_git_tree") != os.environ["RELEASE_TREE"]
                  or (value.get("contract") or {}).get("manifest_sha256")
                  != os.environ["MANIFEST_SHA256"]
                  or (value.get("contract") or {}).get("source_projection_sha256")
                  != os.environ["SOURCE_PROJECTION_SHA256"]
              ):
                  raise SystemExit(f"native {arch} receipt source bindings differ")
              leaf = (value.get("candidate") or {}).get("manifest_digest")
              if not isinstance(leaf, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", leaf) is None:
                  raise SystemExit(f"native {arch} candidate digest is malformed")
              leaf_digests[arch] = leaf
              for sbom_format in ("cyclonedx", "spdx"):
                  sbom_raw = (
                      evidence_root / f"sbom.{arch}.{sbom_format}.json"
                  ).read_bytes()
                  if value["candidate_sbom"][sbom_format] != {
                      "sha256": hashlib.sha256(sbom_raw).hexdigest(),
                      "size": len(sbom_raw),
                  }:
                      raise SystemExit(f"native {arch} {sbom_format} SBOM bytes differ")
              cadence_raw = (evidence_root / f"cadence.{arch}.json").read_bytes()
              if value["cadence_probe"] != {
                  "sha256": hashlib.sha256(cadence_raw).hexdigest(),
                  "size": len(cadence_raw),
              }:
                  raise SystemExit(f"native {arch} cadence probe bytes differ")
              signature_probe_path = evidence_root / f"signature-verifier.{arch}.json"
              if value.get("signature_verifier_probe") != seal(signature_probe_path):
                  raise SystemExit(
                      f"native {arch} signature-verifier probe bytes differ"
                  )
              signature_probe = json.loads(
                  signature_probe_path.read_text(encoding="utf-8")
              )
              signature_authority = value.get("signature_verifier") or {}
              if signature_authority != receipt["signature_verifier"]:
                  raise SystemExit(
                      f"native {arch} signature-verifier authority differs"
                  )
              signature_tool = (signature_authority.get("platforms") or {}).get(
                  f"linux/{arch}"
              ) or {}
              if signature_probe != {
                  "format": "z4j-production-signature-verifier-probe-v1",
                  "platform": {
                      "system": "Linux",
                      "machine": {"amd64": "x86_64", "arm64": "aarch64"}[arch],
                  },
                  "runtime_path": "/usr/local/bin/cosign",
                  "binary_sha256": signature_tool.get("sha256"),
                  "binary_size": signature_tool.get("size"),
                  "version_output_sha256": signature_tool.get(
                      "version_output_sha256"
                  ),
                  "version_output_size": signature_tool.get("version_output_size"),
              }:
                  raise SystemExit(
                      f"native {arch} signature-verifier probe authority differs"
                  )
              smoke_path = evidence_root / f"service-smoke.{arch}.json"
              if value.get("service_smoke") != seal(smoke_path):
                  raise SystemExit(f"native {arch} service-smoke receipt differs")
              smoke = json.loads(smoke_path.read_text(encoding="utf-8"))
              if smoke != {
                  "format": "z4j-production-service-smoke-v1",
                  "platform": f"linux/{arch}",
                  "candidate_manifest_digest": leaf,
                  "entrypoint": ["/usr/bin/tini", "--", "z4j"],
                  "command": ["serve"],
                  "network_mode": "none",
                  "health_status": "healthy",
                  "logs": seal(evidence_root / f"service-smoke.{arch}.log"),
                  "inspection": seal(
                      evidence_root / f"service-smoke.{arch}.inspect.json"
                  ),
                  "result": "pass",
              }:
                  raise SystemExit(f"native {arch} service-smoke evidence differs")
              dashboard_replay_path = evidence_root / f"dashboard-replay.{arch}.json"
              if value.get("dashboard_replay") != seal(dashboard_replay_path):
                  raise SystemExit(f"native {arch} dashboard replay bytes differ")
              dashboard_replay = json.loads(
                  dashboard_replay_path.read_text(encoding="utf-8")
              )
              if dashboard_replay != {
                  "format": "z4j-production-dashboard-replay-v1",
                  "platform": f"linux/{arch}",
                  "result": "pass",
                  "sealed_bundle_tree_sha256": value["dashboard"]["platforms"]
                  [f"linux/{arch}"]["bundle_tree_sha256"],
                  "stdout": dashboard_replay.get("stdout"),
                  "stderr": dashboard_replay.get("stderr"),
              }:
                  raise SystemExit(f"native {arch} dashboard replay shape differs")
              for stream_name in ("stdout", "stderr"):
                  stream_seal = dashboard_replay.get(stream_name) or {}
                  if (
                      not isinstance(stream_seal.get("sha256"), str)
                      or re.fullmatch(r"[0-9a-f]{64}", stream_seal["sha256"])
                      is None
                      or not isinstance(stream_seal.get("size"), int)
                      or stream_seal["size"] < 0
                  ):
                      raise SystemExit(
                          f"native {arch} dashboard replay {stream_name} seal differs"
                      )
                  if stream_seal != seal(
                      evidence_root / f"dashboard-replay.{arch}.{stream_name}"
                  ):
                      raise SystemExit(
                          f"native {arch} dashboard replay {stream_name} bytes differ"
                      )
              scanner = value.get("candidate_scanner") or {}
              scanner_paths = {
                  "report": evidence_root / f"trivy.{arch}.json",
                  "version_transcript": evidence_root / f"trivy-version.{arch}.txt",
                  "database_inventory": evidence_root / f"trivy-database.{arch}.json",
                  "database_metadata": evidence_root
                  / f"trivy-database-metadata.{arch}.json",
              }
              for key, path in scanner_paths.items():
                  if scanner.get(key) != seal(path):
                      raise SystemExit(f"native {arch} scanner {key} bytes differ")
              database_inventory = json.loads(
                  scanner_paths["database_inventory"].read_text(encoding="utf-8")
              )
              if set(database_inventory) != {"format", "files"} or database_inventory[
                  "format"
              ] != "z4j-trivy-database-tree-v1":
                  raise SystemExit(f"native {arch} scanner database inventory shape differs")
              database_root = evidence_root / f"trivy-database-cache.{arch}"
              actual_database_files = {}
              for path in database_root.rglob("*"):
                  relative = path.relative_to(database_root).as_posix()
                  observed = path.stat(follow_symlinks=False)
                  if path.is_symlink() or not (
                      stat.S_ISREG(observed.st_mode) or stat.S_ISDIR(observed.st_mode)
                  ):
                      raise SystemExit(
                          f"native {arch} scanner database has unsafe entry {relative}"
                      )
                  if path.is_file():
                      actual_database_files[relative] = seal(path)
              expected_database_files = {}
              for record in database_inventory["files"]:
                  if not isinstance(record, dict) or set(record) != {
                      "path",
                      "sha256",
                      "size",
                  }:
                      raise SystemExit(
                          f"native {arch} scanner database record is malformed"
                      )
                  relative = record["path"]
                  if (
                      not isinstance(relative, str)
                      or not relative
                      or relative in expected_database_files
                      or Path(relative).is_absolute()
                      or ".." in Path(relative).parts
                  ):
                      raise SystemExit(
                          f"native {arch} scanner database path is unsafe"
                      )
                  expected_database_files[relative] = {
                      "sha256": record["sha256"],
                      "size": record["size"],
                  }
              if actual_database_files != expected_database_files:
                  raise SystemExit(f"native {arch} scanner database bytes differ")

          dashboard_sbom = receipt["dashboard_sbom"]
          if set(dashboard_sbom) != {"cyclonedx", "spdx"}:
              raise SystemExit("dashboard SBOM receipt shape differs")
          for sbom_format in ("cyclonedx", "spdx"):
              sbom_raw = (evidence_root / f"sbom.npm.{sbom_format}.json").read_bytes()
              if dashboard_sbom[sbom_format] != {
                  "sha256": hashlib.sha256(sbom_raw).hexdigest(),
                  "size": len(sbom_raw),
              }:
                  raise SystemExit(f"dashboard {sbom_format} SBOM bytes differ")

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
              stream.write(f"candidate_digest={digest}\n")
              stream.write(f"amd64_digest={leaf_digests['amd64']}\n")
              stream.write(f"arm64_digest={leaf_digests['arm64']}\n")
              stream.write(f"receipt_sha256={hashlib.sha256(receipt_raw).hexdigest()}\n")
              stream.write(f"receipt_size={len(receipt_raw)}\n")
          PY

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # immutable ref; audited 2026-08-20
        with:
          cosign-release: v3.1.3

      - name: Reverify the exact qualification receipt bytes
        env:
          CANDIDATE_DIGEST: ${{ steps.receipt.outputs.candidate_digest }}
        run: |
          cosign verify-blob \
            --bundle /tmp/z4j-promotion/production-finalization.bundle.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-docker.yml@refs/tags/v${VERSION}" \
            /tmp/z4j-promotion/production-finalization.json
          cosign verify-attestation \
            --type https://z4j.dev/attestations/production-container-finalization/v1 \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-docker.yml@refs/tags/v${VERSION}" \
            "${IMAGE}@${CANDIDATE_DIGEST}" \
            > /tmp/z4j-promotion/promotion-verified-attestation.jsonl
          CANDIDATE_DIGEST="${CANDIDATE_DIGEST}" python3 - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          expected = json.loads(
              Path("/tmp/z4j-promotion/production-finalization.json").read_text(
                  encoding="utf-8"
              )
          )
          expected_digest = os.environ["CANDIDATE_DIGEST"].removeprefix("sha256:")
          matches = 0
          for line in Path(
              "/tmp/z4j-promotion/promotion-verified-attestation.jsonl"
          ).read_text(encoding="utf-8").splitlines():
              if not line.strip():
                  continue
              envelope = json.loads(line)
              statement = json.loads(base64.b64decode(envelope["payload"], validate=True))
              if (
                  statement.get("predicateType")
                  == "https://z4j.dev/attestations/production-container-finalization/v1"
                  and statement.get("predicate") == expected
                  and any(
                      (subject.get("digest") or {}).get("sha256") == expected_digest
                      for subject in statement.get("subject") or []
                      if isinstance(subject, dict)
                  )
              ):
                  matches += 1
          if matches < 1:
              raise SystemExit("no exact authenticated qualification attestation matched")
          PY

      - name: Reverify qualified image signatures, SBOMs, and provenance
        env:
          CANDIDATE_DIGEST: ${{ steps.receipt.outputs.candidate_digest }}
          AMD64_DIGEST: ${{ steps.receipt.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.receipt.outputs.arm64_digest }}
        run: |
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-docker.yml@refs/tags/v${VERSION}"
          for digest in "${CANDIDATE_DIGEST}" "${AMD64_DIGEST}" "${ARM64_DIGEST}"; do
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity "${IDENTITY}" \
              "${IMAGE}@${digest}" \
              > "/tmp/z4j-promotion/signature-${digest#sha256:}.json"
          done
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${IDENTITY}" \
            "${IMAGE}@${AMD64_DIGEST}" \
            > /tmp/z4j-promotion/sbom-attestation-amd64.jsonl
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${IDENTITY}" \
            "${IMAGE}@${ARM64_DIGEST}" \
            > /tmp/z4j-promotion/sbom-attestation-arm64.jsonl
          cosign verify-attestation \
            --type cyclonedx \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${IDENTITY}" \
            "${IMAGE}@${CANDIDATE_DIGEST}" \
            > /tmp/z4j-promotion/sbom-attestation-dashboard.jsonl
          cosign verify-attestation \
            --type https://slsa.dev/provenance/v1 \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "${IDENTITY}" \
            "${IMAGE}@${CANDIDATE_DIGEST}" \
            > /tmp/z4j-promotion/build-provenance-attestation.jsonl
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          evidence = Path("/tmp/z4j-qualified-evidence")
          promotion = Path("/tmp/z4j-promotion")
          expected = {
              "amd64": json.loads(
                  (evidence / "sbom.amd64.cyclonedx.json").read_text(encoding="utf-8")
              ),
              "arm64": json.loads(
                  (evidence / "sbom.arm64.cyclonedx.json").read_text(encoding="utf-8")
              ),
              "dashboard": json.loads(
                  (evidence / "sbom.npm.cyclonedx.json").read_text(encoding="utf-8")
              ),
          }
          for subject, predicate in expected.items():
              statements = []
              for line in (promotion / f"sbom-attestation-{subject}.jsonl").read_text(
                  encoding="utf-8"
              ).splitlines():
                  if line.strip():
                      envelope = json.loads(line)
                      statements.append(
                          json.loads(base64.b64decode(envelope["payload"], validate=True))
                      )
              if not any(statement.get("predicate") == predicate for statement in statements):
                  raise SystemExit(f"authenticated {subject} SBOM predicate bytes differ")
          provenance = (
              promotion / "build-provenance-attestation.jsonl"
          ).read_text(encoding="utf-8")
          if not provenance.strip():
              raise SystemExit("authenticated build provenance attestation is absent")
          PY

      - name: Set up exact Docker Buildx authority
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # immutable ref; audited 2026-08-20
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # immutable ref; audited 2026-08-20
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refetch and verify candidate registry bytes
        env:
          CANDIDATE_DIGEST: ${{ steps.receipt.outputs.candidate_digest }}
          AMD64_DIGEST: ${{ steps.receipt.outputs.amd64_digest }}
          ARM64_DIGEST: ${{ steps.receipt.outputs.arm64_digest }}
        run: |
          curl --fail --silent --show-error --get \
            --data-urlencode 'service=registry.docker.io' \
            --data-urlencode "scope=repository:${IMAGE}:pull" \
            --output /tmp/registry-token.json \
            'https://auth.docker.io/token'
          REGISTRY_TOKEN=$(python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("/tmp/registry-token.json").read_text(encoding="utf-8")).get("token")
          if not isinstance(value, str) or not value:
              raise SystemExit("Docker Registry read token is absent")
          print(value)
          PY
          )
          fetch_manifest() {
            digest="$1"
            destination="$2"
            curl --fail --silent --show-error \
              --header "Authorization: Bearer ${REGISTRY_TOKEN}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
              --output "${destination}" \
              "https://registry-1.docker.io/v2/${IMAGE}/manifests/${digest}"
          }
          fetch_manifest "${CANDIDATE_DIGEST}" /tmp/z4j-promotion/refetched-index.json
          fetch_manifest "${AMD64_DIGEST}" /tmp/z4j-promotion/refetched-amd64.manifest.json
          fetch_manifest "${ARM64_DIGEST}" /tmp/z4j-promotion/refetched-arm64.manifest.json
          REGISTRY_TOKEN="${REGISTRY_TOKEN}" python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          root = Path("/tmp/z4j-promotion")
          receipt = json.loads((root / "production-finalization.json").read_text(encoding="utf-8"))
          retained_index = (root / "staging-index.json").read_bytes()
          refetched_index = (root / "refetched-index.json").read_bytes()
          if refetched_index != retained_index:
              raise SystemExit("registry candidate index bytes differ from qualified bytes")
          index = json.loads(refetched_index)
          if (
              index.get("schemaVersion") != 2
              or index.get("mediaType") != "application/vnd.oci.image.index.v1+json"
          ):
              raise SystemExit("candidate registry index schema/media type differs")
          descriptors = index.get("manifests")
          if not isinstance(descriptors, list) or len(descriptors) != 2:
              raise SystemExit("candidate registry index is not an exact two-descriptor matrix")
          by_arch = {}
          for descriptor in descriptors:
              platform = descriptor.get("platform") or {}
              if platform.get("os") != "linux" or platform.get("architecture") not in {
                  "amd64",
                  "arm64",
              }:
                  raise SystemExit("candidate registry index has an unexpected platform")
              by_arch[platform["architecture"]] = descriptor
          if set(by_arch) != {"amd64", "arm64"}:
              raise SystemExit("candidate registry index platform matrix differs")

          token = os.environ["REGISTRY_TOKEN"]
          for arch in ("amd64", "arm64"):
              native = receipt["native"][arch]
              candidate = native["candidate"]
              leaf_raw = (root / f"refetched-{arch}.manifest.json").read_bytes()
              digest = "sha256:" + hashlib.sha256(leaf_raw).hexdigest()
              if (
                  digest != candidate["manifest_digest"]
                  or len(leaf_raw) != candidate["manifest_size"]
                  or by_arch[arch].get("digest") != digest
                  or by_arch[arch].get("size") != len(leaf_raw)
              ):
                  raise SystemExit(f"registry {arch} candidate manifest differs")
              leaf = json.loads(leaf_raw)
              config = leaf.get("config") or {}
              if (
                  config.get("digest") != candidate["config_digest"]
                  or config.get("size") != candidate["config_size"]
              ):
                  raise SystemExit(f"registry {arch} config descriptor differs")
              request = urllib.request.Request(
                  f"https://registry-1.docker.io/v2/{os.environ['IMAGE']}/blobs/{config['digest']}",
                  headers={"Authorization": f"Bearer {token}"},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  config_raw = response.read(8 * 1024 * 1024 + 1)
              if (
                  len(config_raw) > 8 * 1024 * 1024
                  or "sha256:" + hashlib.sha256(config_raw).hexdigest() != config["digest"]
                  or len(config_raw) != config["size"]
              ):
                  raise SystemExit(f"registry {arch} config bytes differ")
              config_json = json.loads(config_raw)
              if (config_json.get("os"), config_json.get("architecture")) != ("linux", arch):
                  raise SystemExit(f"registry {arch} config platform differs")
              labels = (config_json.get("config") or {}).get("Labels") or {}
              if any(labels.get(key) != value for key, value in candidate["labels"].items()):
                  raise SystemExit(f"registry {arch} config labels differ")
          PY

      - name: Capture Docker Hub immutable-tag authority
        id: immutable
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          umask 077
          AUTH_REQUEST=$(mktemp)
          python3 - "${AUTH_REQUEST}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(
              json.dumps(
                  {
                      "identifier": os.environ["DOCKERHUB_USERNAME"],
                      "secret": os.environ["DOCKERHUB_TOKEN"],
                  },
                  separators=(",", ":"),
              ),
              encoding="utf-8",
          )
          PY
          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data-binary "@${AUTH_REQUEST}" \
            --output /tmp/dockerhub-auth.json \
            https://hub.docker.com/v2/auth/token
          rm -f "${AUTH_REQUEST}"
          HUB_TOKEN=$(python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("/tmp/dockerhub-auth.json").read_text(encoding="utf-8")).get("access_token")
          if not isinstance(value, str) or not value:
              raise SystemExit("Docker Hub API access token is absent")
          print(value)
          PY
          )
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${HUB_TOKEN}" \
            --output /tmp/dockerhub-repository.json \
            https://hub.docker.com/v2/namespaces/z4jdev/repositories/z4j
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          response = json.loads(Path("/tmp/dockerhub-repository.json").read_text(encoding="utf-8"))
          settings = response.get("immutable_tags_settings")
          required_rule = r"^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$"
          if (
              response.get("namespace") != "z4jdev"
              or response.get("name") != "z4j"
              or not isinstance(settings, dict)
              or settings.get("enabled") is not True
              or not isinstance(settings.get("rules"), list)
              or settings["rules"].count(required_rule) != 1
              or any(not isinstance(rule, str) for rule in settings["rules"])
          ):
              raise SystemExit("Docker Hub immutable release-tag authority differs")
          try:
              compiled_rules = [re.compile(rule) for rule in settings["rules"]]
          except re.error as exc:
              raise SystemExit("Docker Hub immutable tag rule is malformed") from exc
          if any(rule.fullmatch("latest") for rule in compiled_rules):
              raise SystemExit("Docker Hub immutable tag policy would prevent latest updates")
          authority = {
              "format": "z4j-dockerhub-immutable-tag-authority-v1",
              "result": "pass",
              "namespace": "z4jdev",
              "repository": "z4j",
              "target_tag": os.environ["VERSION"],
              "required_rule": required_rule,
              "immutable_tags_settings": settings,
          }
          raw = json.dumps(
              authority, sort_keys=True, separators=(",", ":"), ensure_ascii=True
          ).encode("ascii") + b"\n"
          Path("/tmp/z4j-promotion/dockerhub-immutable-authority.json").write_bytes(raw)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"authority_sha256={hashlib.sha256(raw).hexdigest()}\n")
              stream.write(f"authority_size={len(raw)}\n")
          PY
          printf '%s' "${HUB_TOKEN}" > /tmp/dockerhub-api-token
          chmod 600 /tmp/dockerhub-api-token

      - name: Preflight source tag, public version tag, and latest policy
        id: preflight
        env:
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
          CANDIDATE_DIGEST: ${{ steps.receipt.outputs.candidate_digest }}
        run: |
          if ! RELEASE_TAG_REFS=$(git ls-remote --tags origin \
            "refs/tags/v${VERSION}" "refs/tags/v${VERSION}^{}"); then
            echo "::error::cannot revalidate release tag v${VERSION}"
            exit 1
          fi
          DIRECT_SHA=$(awk '$2 !~ /\^\{\}$/ {print $1}' <<< "${RELEASE_TAG_REFS}")
          PEELED_SHA=$(awk '$2 ~ /\^\{\}$/ {print $1}' <<< "${RELEASE_TAG_REFS}")
          if [ "${PEELED_SHA:-${DIRECT_SHA}}" != "${RELEASE_SHA}" ]; then
            echo "::error::release tag moved or disappeared after qualification"
            exit 1
          fi

          curl --fail --silent --show-error --get \
            --data-urlencode 'service=registry.docker.io' \
            --data-urlencode "scope=repository:${IMAGE}:pull" \
            --output /tmp/preflight-registry-token.json \
            'https://auth.docker.io/token'
          REGISTRY_TOKEN=$(python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path("/tmp/preflight-registry-token.json").read_text(encoding="utf-8")).get("token")
          if not isinstance(value, str) or not value:
              raise SystemExit("Docker Registry read token is absent")
          print(value)
          PY
          )
          STATUS=$(curl --silent --show-error --head \
            --output /tmp/version-tag.headers --write-out '%{http_code}' \
            --header "Authorization: Bearer ${REGISTRY_TOKEN}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://registry-1.docker.io/v2/${IMAGE}/manifests/${VERSION}")
          VERSION_EXISTS=false
          case "${STATUS}" in
            200)
              EXISTING_DIGEST=$(tr -d '\r' < /tmp/version-tag.headers \
                | sed -n 's/^[Dd]ocker-[Cc]ontent-[Dd]igest: //p')
              if [ "${EXISTING_DIGEST}" != "${CANDIDATE_DIGEST}" ]; then
                echo "::error::immutable version tag exists at ${EXISTING_DIGEST}, candidate is ${CANDIDATE_DIGEST}"
                exit 1
              fi
              VERSION_EXISTS=true
              ;;
            404) ;;
            *)
              echo "::error::version-tag preflight returned HTTP ${STATUS}"
              exit 1
              ;;
          esac

          IS_LATEST=false
          case "${VERSION}" in
            *-*) ;;
            *)
              if ! REMOTE_TAG_REFS=$(git ls-remote --tags --refs origin 'v*'); then
                echo "::error::cannot enumerate source release tags"
                exit 1
              fi
              TAG_NAMES=$(printf '%s\n' "${REMOTE_TAG_REFS}" | sed 's|.*refs/tags/||')
              STABLE_TAGS=$(printf '%s\n' "${TAG_NAMES}" \
                | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                | sed 's/^v//' || true)
              HIGHEST=$(printf '%s\n%s\n' "${STABLE_TAGS}" "${VERSION}" \
                | sed '/^$/d' | sort -V | tail -n 1)
              if [ "${HIGHEST}" = "${VERSION}" ]; then
                IS_LATEST=true
              fi
              ;;
          esac
          {
            echo "is_latest=${IS_LATEST}"
            echo "version_exists=${VERSION_EXISTS}"
          } >> "${GITHUB_OUTPUT}"

      - name: Revalidate immutable-tag authority immediately before mutation
        env:
          CANDIDATE_DIGEST: ${{ steps.receipt.outputs.candidate_digest }}
          VERSION_EXISTS: ${{ steps.preflight.outputs.version_exists }}
        run: |
          HUB_TOKEN=$(cat /tmp/dockerhub-api-token)
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${HUB_TOKEN}" \
            --output /tmp/dockerhub-repository-recheck.json \
            https://hub.docker.com/v2/namespaces/z4jdev/repositories/z4j
          python3 - <<'PY'
          import json
          from pathlib import Path

          previous = json.loads(
              Path("/tmp/z4j-promotion/dockerhub-immutable-authority.json").read_text(
                  encoding="utf-8"
              )
          )
          response = json.loads(
              Path("/tmp/dockerhub-repository-recheck.json").read_text(encoding="utf-8")
          )
          if response.get("immutable_tags_settings") != previous["immutable_tags_settings"]:
              raise SystemExit("Docker Hub immutable-tag settings changed during promotion")
          PY

          # Docker Registry PUT has no atomic create-only conditional. The
          # server-side immutable SemVer rule proven immediately above is the
          # authority that makes this absent-to-create transition race-safe.
          if [ "${VERSION_EXISTS}" != true ]; then
            docker buildx imagetools create --prefer-index=false \
              --tag "${IMAGE}:${VERSION}" "${IMAGE}@${CANDIDATE_DIGEST}"
          fi

      - name: Verify promoted version and latest tags
        env:
          CANDIDATE_DIGEST: ${{ steps.receipt.outputs.candidate_digest }}
          IS_LATEST: ${{ steps.preflight.outputs.is_latest }}
        run: |
          resolve() {
            docker buildx imagetools inspect "${IMAGE}:$1" --format '{{ .Manifest.Digest }}'
          }
          if [ "$(resolve "${VERSION}")" != "${CANDIDATE_DIGEST}" ]; then
            echo "::error::version tag does not resolve to the qualified digest"
            exit 1
          fi
          if [ "${IS_LATEST}" = true ]; then
            docker buildx imagetools create --prefer-index=false \
              --tag "${IMAGE}:latest" "${IMAGE}@${CANDIDATE_DIGEST}"
            if [ "$(resolve latest)" != "${CANDIDATE_DIGEST}" ]; then
              echo "::error::latest tag does not resolve to the qualified digest"
              exit 1
            fi
          fi

      - name: Create and byte-sign promotion evidence
        env:
          CANDIDATE_DIGEST: ${{ steps.receipt.outputs.candidate_digest }}
          RELEASE_SHA: ${{ steps.source.outputs.release_sha }}
          RELEASE_TREE: ${{ steps.source.outputs.release_tree }}
          RECEIPT_SHA256: ${{ steps.receipt.outputs.receipt_sha256 }}
          RECEIPT_SIZE: ${{ steps.receipt.outputs.receipt_size }}
          IMMUTABLE_AUTHORITY_SHA256: ${{ steps.immutable.outputs.authority_sha256 }}
          IMMUTABLE_AUTHORITY_SIZE: ${{ steps.immutable.outputs.authority_size }}
          IS_LATEST: ${{ steps.preflight.outputs.is_latest }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = {
              "format": "z4j-production-container-promotion-v1",
              "result": "pass",
              "release": os.environ["VERSION"],
              "release_git_commit": os.environ["RELEASE_SHA"],
              "release_git_tree": os.environ["RELEASE_TREE"],
              "qualification_run_id": int(os.environ["QUALIFICATION_RUN_ID"]),
              "qualification_receipt": {
                  "sha256": os.environ["RECEIPT_SHA256"],
                  "size": int(os.environ["RECEIPT_SIZE"]),
              },
              "candidate_index_digest": os.environ["CANDIDATE_DIGEST"],
              "dockerhub_immutable_tag_authority": {
                  "sha256": os.environ["IMMUTABLE_AUTHORITY_SHA256"],
                  "size": int(os.environ["IMMUTABLE_AUTHORITY_SIZE"]),
              },
              "promoted_tags": [
                  os.environ["VERSION"],
                  *(["latest"] if os.environ["IS_LATEST"] == "true" else []),
              ],
          }
          raw = json.dumps(
              receipt, sort_keys=True, separators=(",", ":"), ensure_ascii=True
          ).encode("ascii") + b"\n"
          Path("/tmp/z4j-promotion/promotion-receipt.json").write_bytes(raw)
          PY
          cosign sign-blob --yes \
            --bundle /tmp/z4j-promotion/promotion-receipt.bundle.json \
            /tmp/z4j-promotion/promotion-receipt.json
          cosign verify-blob \
            --bundle /tmp/z4j-promotion/promotion-receipt.bundle.json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity \
              "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/promote-release-docker.yml@refs/heads/main" \
            /tmp/z4j-promotion/promotion-receipt.json

      - name: Retain promotion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # immutable ref; audited 2026-08-20
        with:
          name: production-promotion-${{ inputs.version }}
          path: |
            /tmp/z4j-promotion/production-finalization.json
            /tmp/z4j-promotion/production-finalization.bundle.json
            /tmp/z4j-promotion/promotion-verified-attestation.jsonl
            /tmp/z4j-promotion/dockerhub-immutable-authority.json
            /tmp/z4j-promotion/promotion-receipt.json
            /tmp/z4j-promotion/promotion-receipt.bundle.json
            /tmp/z4j-promotion/refetched-index.json
            /tmp/z4j-promotion/refetched-amd64.manifest.json
            /tmp/z4j-promotion/refetched-arm64.manifest.json
            /tmp/z4j-promotion/signature-*.json
            /tmp/z4j-promotion/sbom-attestation-*.jsonl
            /tmp/z4j-promotion/build-provenance-attestation.jsonl
          if-no-files-found: error
          retention-days: 90
