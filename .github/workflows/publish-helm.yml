# =============================================================================
# z4j Helm chart publish, from the release tag
#
# Packages deploy/helm/z4j for a z4j version that is ALREADY released, pushes
# it as an OCI artifact to ghcr.io/z4jdev/charts/z4j, signs the chart digest
# keylessly with cosign and attests its provenance, following
# publish-docker.yml step for step.
#
# Why dispatch-only
# -----------------
# publish-docker.yml is dispatch-only because release-docker.yml owns the
# tag-push trigger, and two publishers racing for one tag is the failure its
# concurrency comment describes. The chart has the same shape: the operator
# dispatches it with the version once the image exists, and the workflow
# checks out exactly refs/tags/v<version>, so the chart bytes come from the
# tagged commit regardless of the branch the dispatch was started from.
#
# Chart version == app version
# ----------------------------
# Chart.yaml carries ``version`` and ``appVersion``, both stamped to the
# release by ``make stamp-version`` and guarded by
# scripts/check-version-carriers.py. The workflow refuses to run when the
# tag's Chart.yaml disagrees with the dispatched version, then packages with
# both set explicitly so the registry tag, the chart version and the image
# tag are one number.
# =============================================================================

name: publish-helm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "z4j release version whose chart to publish, without the leading v"
        required: true
        type: string

concurrency:
  # One chart publisher at a time; a chart tag must be decided once.
  group: z4j-helm-publisher
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push the OCI chart to ghcr.io
  id-token: write # keyless cosign and provenance attestation
  attestations: write

env:
  CHART_DIR: deploy/helm/z4j
  OCI_REPOSITORY: ghcr.io/z4jdev/charts
  CHART_NAME: z4j

jobs:
  publish:
    name: Package, push, sign and attest
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # immutable ref; audited 2026-08-20
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false

      - name: Verify the tagged chart names this version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          chart_version=$(sed -n 's/^version: "\(.*\)"$/\1/p' "${CHART_DIR}/Chart.yaml")
          app_version=$(sed -n 's/^appVersion: "\(.*\)"$/\1/p' "${CHART_DIR}/Chart.yaml")
          echo "Chart.yaml version=${chart_version} appVersion=${app_version} dispatched=${VERSION}"
          if [ "${chart_version}" != "${VERSION}" ] || [ "${app_version}" != "${VERSION}" ]; then
            echo "the tagged Chart.yaml does not name ${VERSION}; stamp the release first" >&2
            exit 1
          fi

      - name: Helm is preinstalled on the runner image
        run: helm version

      - name: Lint the chart in its default and full-featured shapes
        run: |
          set -euo pipefail
          helm lint "${CHART_DIR}"
          helm lint "${CHART_DIR}" \
            --set scheduler.enabled=true \
            --set pki.mintJob.enabled=true \
            --set postgresql.enabled=true \
            --set postgresql.auth.password=lint-only \
            --set brain.secrets.inline.appSecret=lint-only \
            --set brain.secrets.inline.sessionSecret=lint-only \
            --set brain.secrets.inline.auditChainSecret=lint-only \
            --set scheduler.config.metricsAuthExistingSecret=lint-only \
            --set brain.ingress.enabled=true
          helm lint "${CHART_DIR}" \
            --set brain.enabled=false \
            --set scheduler.enabled=true \
            --set scheduler.brain.grpcUrl=brain.example.internal:7701 \
            --set scheduler.brain.restUrl=http://brain.example.internal:7700 \
            --set scheduler.tls.existingSecret=lint-only \
            --set scheduler.leader.existingSecret=lint-only \
            --set scheduler.config.metricsAuthExistingSecret=lint-only

      - name: Package with the version and appVersion from the tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package "${CHART_DIR}" --version "${VERSION}" --app-version "${VERSION}" --destination dist
          test -f "dist/${CHART_NAME}-${VERSION}.tgz"
          sha256sum "dist/${CHART_NAME}-${VERSION}.tgz"

      - name: Login to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Push the chart
        id: push
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          helm push "dist/${CHART_NAME}-${VERSION}.tgz" "oci://${OCI_REPOSITORY}" 2>&1 | tee push.log
          digest=$(sed -n 's/^Digest: \(sha256:[0-9a-f]\{64\}\)$/\1/p' push.log | head -1)
          test -n "${digest}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "published oci://${OCI_REPOSITORY}/${CHART_NAME}:${VERSION} as ${digest}"

      - name: Login to GitHub Container Registry for cosign and the attestation
        # helm registry login writes helm's own registry file; cosign and the
        # provenance push read the Docker credential store, so without this
        # login the signing step reaches ghcr.io anonymously and is refused.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # immutable ref; audited 2026-08-20
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # immutable ref; audited 2026-08-20
        with:
          cosign-release: v3.1.3

      - name: Sign the chart digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${OCI_REPOSITORY}/${CHART_NAME}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # immutable ref; audited 2026-08-20
        with:
          subject-name: ${{ env.OCI_REPOSITORY }}/${{ env.CHART_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Verify what the registry now serves
        env:
          VERSION: ${{ inputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          rm -rf verify && mkdir verify
          helm pull "oci://${OCI_REPOSITORY}/${CHART_NAME}" --version "${VERSION}" --destination verify

          echo "--- the pulled chart names the version it claims ---"
          helm show chart "verify/${CHART_NAME}-${VERSION}.tgz" | tee verify/chart.yaml
          grep -qx "version: ${VERSION}" verify/chart.yaml
          grep -qx "appVersion: ${VERSION}" verify/chart.yaml

          echo "--- the pulled bytes are the bytes that were pushed ---"
          cmp "dist/${CHART_NAME}-${VERSION}.tgz" "verify/${CHART_NAME}-${VERSION}.tgz"

          echo "--- the signature is verifiable from the registry ---"
          cosign verify "${OCI_REPOSITORY}/${CHART_NAME}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          echo "signature verified"
