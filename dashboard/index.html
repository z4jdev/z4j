<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>z4j</title>
    <script>
      // Apply display mode and the coordinated palette before first paint.
      (function () {
        var stored = null, palette = null, hue = null;
        try {
          stored = localStorage.getItem("z4j-theme");
          palette = localStorage.getItem("z4j-palette");
          hue = localStorage.getItem("z4j-primary-hue");
        } catch (_e) {}
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = stored === "light" || stored === "dark" ? stored : (prefersDark ? "dark" : "light");
        var legacy = {250:"sapphire",280:"iris",310:"iris",350:"sandstone",25:"sandstone",50:"sandstone",150:"jade",180:"jade",210:"sapphire"};
        var chosen = ["sapphire", "jade", "iris", "sandstone"].indexOf(palette) >= 0
          ? palette : (Object.prototype.hasOwnProperty.call(legacy, hue) ? legacy[hue] : "sapphire");
        var root = document.documentElement;
        root.classList.toggle("dark", theme === "dark");
        root.classList.toggle("light", theme === "light");
        root.style.colorScheme = theme;
        root.setAttribute("data-palette", chosen);
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
