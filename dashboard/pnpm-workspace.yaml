# pnpm 11.22 project authority. pnpm 11 reads project settings here;
# .npmrc is retained only for npm-compatible script blocking and registry TLS.
packages:
  - "."

# Registry and transport policy.
registry: https://registry.npmjs.org/
strictSsl: true

# Dependency layout and lock discipline.
hoist: false
shamefullyHoist: false
preferFrozenLockfile: true

# Supply-chain quarantine. Missing publish timestamps fail closed, and the
# independent scripts/check-lockfile-age.py gate verifies committed locks.
minimumReleaseAge: 4320
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true

# Lifecycle scripts are denied twice: ignore every lifecycle hook, then make
# every package currently known to declare one an explicit false decision.
# Unknown future build scripts remain unreviewed and fail strictDepBuilds.
ignoreScripts: true
enablePrePostScripts: false
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
allowBuilds:
  esbuild: false
  fsevents: false

# Bounded security floors; they may move to later fixes within the same line.
overrides:
  brace-expansion: ">=5.0.9 <6"
  undici: ">=7.29.0 <8"
  esbuild: ">=0.28.1 <0.29"
  "js-yaml@>=4.0.0 <4.3.1": ">=4.3.1 <5"
  "nanoid@<3.3.18": ">=3.3.18 <4"

auditConfig:
  ignoreCves: []
